<title>사진 좌우반전 도구</title>
<link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css&quot;>
<style>
/* 색: 그레이·블랙·그린 (시공 계산기와 같은 계열) — 고르는 칸은 초록, 제목·글씨는 검정 */
:root{
  --ground:#F2F3F1;--paper:#FFFFFF;--sand:#E4E7E3;--line:#DCDFDB;--ink:#1D211F;--muted:#6B716D;
  --brown:#3C4440;--brown-deep:#1D211F;--green:#1E7A52;--green-deep:#165F3F;--green-soft:#E3F1E9;--bad:#C0392B;--radius:16px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;word-break:keep-all;color-scheme:light}
button,input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-deep)}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.mini{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.mini:hover{background:#fff;color:var(--ink)}
.mini:disabled{opacity:.4;cursor:default;background:none;color:var(--muted)}
.ic{width:32px;height:32px;flex:none;border:0;border-radius:8px;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ic:hover{background:var(--sand);color:var(--ink)}
.ic.del:hover{color:var(--bad)}

/* 두 칸 배치 (왼쪽 사진, 오른쪽 설정) */
.top{padding:6px 4px 14px}
.top h1{font-size:20px;margin:0;color:var(--brown-deep);line-height:1.3}
.top p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.layout{max-width:1280px;margin:0 auto;padding:14px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.main-col{min-width:0}
.side{position:sticky;top:14px;display:grid;gap:12px;max-height:calc(100vh - 28px);overflow:auto;border-radius:var(--radius)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}

/* 사진 목록 */
.ph-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ph-head h2{margin:0;flex:1;font-size:16px;color:var(--ink)}
.ph-head h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:380px;border:2px dashed var(--line);border-radius:14px;background:#F7F8F7;text-align:center;cursor:pointer;padding:24px;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--brown);background:#fff}
.drop .big{width:60px;height:60px;border-radius:18px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center}
.drop .big svg.i{width:28px;height:28px}
.drop b{font-size:18px}
.drop span{font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.ph-img{position:relative;display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:#ECEEEC;cursor:pointer;transition:background .15s}
.ph-img:hover{background:#E2E5E2}
.ph-img:focus-visible{outline:2px solid var(--brown);outline-offset:-2px}
.ph-img .in{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center}
.ph-img canvas{display:block;width:100%;height:100%;object-fit:contain}
.ph-img .badge{position:absolute;left:8px;top:8px;background:var(--brown-deep);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.ph:not(.own) .badge{display:none}
.ph.loading .ph-img{cursor:progress}
.ph-bar{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 10px;border-top:1px solid var(--line)}
.ph-name{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brown);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.add-tile{min-height:220px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--brown-deep);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s,border-color .15s}
.add-tile:hover{background:#fff;border-color:var(--brown)}
.add-tile svg.i{width:24px;height:24px}

/* 조정 칸 */
.ctl{padding:12px 0;border-top:1px solid var(--line)}
.ctl:first-child{border-top:0;padding-top:0}
.ctl:last-child{padding-bottom:0}
.ctl-label{font-weight:700;font-size:14px}
.ctl > .ctl-label{display:block;margin-bottom:8px}
.ctl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sub-label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.togs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.tog:hover{color:var(--ink);border-color:var(--brown)}
.tog[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.tog.wide{width:100%;height:48px;font-size:15px}
.rots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;background:var(--sand);padding:4px;border-radius:12px}
.seg button{height:36px;border:0;background:none;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:0 4px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--green);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* 슬라이더 한 줄: 이름 | 막대 | 숫자 | 되돌리기 */
.sl{display:grid;grid-template-columns:46px minmax(0,1fr) 52px 26px;align-items:center;gap:6px;min-height:36px}
.sl-l{font-size:13.5px;font-weight:600;white-space:nowrap}
.sl input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;--track:var(--sand)}
.sl input[type=range]:focus{outline:none}
.sl input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--track)}
.sl input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--track)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:#fff;border:2px solid var(--green);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sl input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--green)}
.sl input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(138,106,83,.3)}
.sl-n{width:52px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:right;padding:0 7px;font-size:14px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.sl-n::-webkit-inner-spin-button,.sl-n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sl-n:focus{outline:2px solid var(--brown);outline-offset:-1px;border-color:var(--brown)}
.sl-x{width:26px;height:26px;padding:0;border:0;border-radius:7px;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sl-x svg.i{width:14px;height:14px}
.sl-x:hover{background:var(--sand);color:var(--ink)}
/* 기울기 눈금자: 끌면 눈금이 손을 따라오고 10px = 1° */
.dial{position:relative;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:ew-resize;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.dial:focus{outline:none}
.dial:focus-visible{outline:2px solid var(--brown);outline-offset:1px}
.dial canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dial::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#fff,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,#fff)}
.dial::after{content:'';position:absolute;z-index:2;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--green);pointer-events:none}
.dial.on{border-color:var(--green)}

/* 저장 — PC에서는 오른쪽 칸 맨 아래에 항상 보이게 고정 */
.frow{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px}
.frow + .frow{margin-top:8px}
.txt{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-size:15px}
.txt:focus{outline:2px solid var(--brown);outline-offset:-1px;border-color:var(--brown)}
.save .seg button{height:32px;font-size:13px}
.save .hint{margin-top:6px}
.save-btns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px;margin-top:12px}
.save-btns .btn{padding:0 10px;font-size:14.5px}
.prog{margin-top:12px}
.bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.prog p{margin:6px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:901px){
  .side .save{position:sticky;bottom:0;z-index:1;box-shadow:0 -10px 18px -14px rgba(60,40,20,.35)}
}

/* 한 장씩 조정 창 */
dialog.ed{padding:0;border:0;border-radius:18px;width:min(1280px,calc(100vw - 32px));height:min(880px,calc(100vh - 32px));max-width:none;max-height:none;background:var(--paper);color:var(--ink);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.ed::backdrop{background:rgba(30,26,22,.62)}
.ed-in{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.ed-view{position:relative;background:#1E2220;min-height:0;overflow:hidden}
.ed-stage{position:absolute;inset:24px 68px 70px}
.ed-stage canvas{display:block;width:100%;height:100%;object-fit:contain}
.gridov{position:absolute;pointer-events:none;outline:1px solid rgba(255,255,255,.55);background-image:linear-gradient(rgba(255,255,255,.55) 1px,rgba(0,0,0,.2) 1px,rgba(0,0,0,.2) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 1px,rgba(0,0,0,.2) 1px,rgba(0,0,0,.2) 2px,transparent 2px);background-size:56px 56px;background-position:center}
/* 자르기 네모: 바깥은 어둡게, 가운데 끌면 옮기기, 모서리·변 끌면 크기 */
.cropov{position:absolute;pointer-events:none}
.cbox{position:absolute;pointer-events:auto;cursor:move;touch-action:none;outline:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 9999px rgba(20,16,12,.6);
  background-image:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% + .5px),transparent calc(66.67% + .5px)),
  linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% + .5px),transparent calc(66.67% + .5px))}
.cbox b{position:absolute;width:14px;height:14px;background:#fff;border:1px solid rgba(0,0,0,.35);border-radius:3px;transform:translate(-50%,-50%)}
.cbox b::after{content:'';position:absolute;inset:-9px}
.cbox b[data-h=nw]{left:0;top:0;cursor:nwse-resize}.cbox b[data-h=se]{left:100%;top:100%;cursor:nwse-resize}
.cbox b[data-h=ne]{left:100%;top:0;cursor:nesw-resize}.cbox b[data-h=sw]{left:0;top:100%;cursor:nesw-resize}
.cbox b[data-h=n]{left:50%;top:0;width:24px;height:8px;cursor:ns-resize}.cbox b[data-h=s]{left:50%;top:100%;width:24px;height:8px;cursor:ns-resize}
.cbox b[data-h=e]{left:100%;top:50%;width:8px;height:24px;cursor:ew-resize}.cbox b[data-h=w]{left:0;top:50%;width:8px;height:24px;cursor:ew-resize}
.cbox.lock b[data-h=n],.cbox.lock b[data-h=s],.cbox.lock b[data-h=e],.cbox.lock b[data-h=w]{display:none}
/* 가리기(블러·모자이크) 그리기 판 */
.drawov{position:absolute;cursor:crosshair;touch-action:none;z-index:1}
.drawov.brush{cursor:none}
.shape-prev{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25);background:rgba(255,255,255,.12);pointer-events:none}
.shape-prev.e{border-radius:50%}
.brush-cur{position:absolute;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.35);pointer-events:none;transform:translate(-50%,-50%)}
.brush-cur.erase{border-style:dashed}
.fx-tools{margin-bottom:8px}
.fx-tools button{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.fx-tools svg.i{width:15px;height:15px}
.nav{position:absolute;top:calc(50% - 22px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.nav svg.i{width:24px;height:24px}
.nav:hover{background:rgba(255,255,255,.26)}
.nav:disabled{opacity:.2;cursor:default;background:rgba(255,255,255,.14)}
.nav.prev{left:12px}.nav.next{right:12px}
.ed-foot{position:absolute;left:0;right:0;bottom:16px;z-index:2;display:flex;justify-content:center;align-items:center;gap:10px;color:#E8E0D6;font-size:13px;font-variant-numeric:tabular-nums}
.ed-foot #edCount{margin-right:4px}
.hold{height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold:hover{background:rgba(255,255,255,.16)}
.hold.on,.hold[aria-pressed=true]{background:#fff;color:var(--ink)}
.ed-side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.ed-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 18px;border-bottom:1px solid var(--line)}
.ed-head b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.ed-body{flex:1;overflow:auto;padding:14px 18px 16px}
.ed-mode{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--sand);color:var(--muted);margin:0 0 12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-mode.own{background:var(--green-soft);color:var(--green-deep);font-weight:700}
/* 자르기 화면: 다른 조정 칸은 숨기고 자르기만 */
.crop-panel{display:grid;gap:10px}
.crop-panel h3{margin:0;font-size:16px}
.crop-panel .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crop-go{width:100%}
.all-row{margin-top:14px}
.all-row .ctl-label{display:block;margin-bottom:8px}
.ed-acts{display:grid;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.ed-acts .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed-acts .two .btn{padding:0 6px;font-size:13.5px}

/* 끌어다 놓기 · 알림 */
.dropcover{position:fixed;inset:12px;border:3px dashed var(--green);border-radius:20px;background:rgba(247,243,236,.93);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--green);z-index:999;pointer-events:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1000;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;overflow:visible}
}
@media (max-width:760px){
  dialog.ed{width:100vw;height:100vh;height:100dvh;border-radius:0}
  .ed-in{grid-template-columns:minmax(0,1fr);grid-template-rows:44vh minmax(0,1fr)}
  .ed-side{border-left:0}
  .ed-stage{inset:14px 54px 60px}
  .nav{width:38px;height:38px;top:calc(50% - 40px)}
  .nav.prev{left:8px}.nav.next{right:8px}
  .hold{padding:0 11px}
}
@media (max-width:560px){
  .top{padding:4px 2px 12px}
  .layout{padding:12px 16px 32px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .drop{min-height:260px}
}
</style>
</head>
<body>

<div class=&quot;layout&quot;>
  <div class=&quot;main-col&quot;>
  <header class=&quot;top&quot;>
    <h1>사진 좌우반전 · 보정</h1>
  </header>
  <main class=&quot;card&quot;>
    <div class=&quot;ph-head&quot;>
      <h2 id=&quot;count&quot;>사진</h2>
      <button type=&quot;button&quot; class=&quot;btn sm&quot; id=&quot;editBtn&quot; data-ico=&quot;right&quot;>한 장씩 조정하기</button>
      <button type=&quot;button&quot; class=&quot;btn sm&quot; id=&quot;addBtn&quot; data-ico=&quot;plus&quot;>사진 추가</button>
      <button type=&quot;button&quot; class=&quot;btn sm&quot; id=&quot;clearBtn&quot; data-ico=&quot;trash&quot;>모두 빼기</button>
    </div>
    <label class=&quot;drop&quot; id=&quot;drop&quot; for=&quot;file&quot;>
      <span class=&quot;big&quot; data-ico=&quot;up&quot;></span>
      <b>사진을 끌어다 놓거나 눌러서 고르세요</b>
      <span>여러 장 · 폴더째 가능</span>
    </label>
    <div class=&quot;grid&quot; id=&quot;grid&quot; hidden>
      <button type=&quot;button&quot; class=&quot;add-tile&quot; id=&quot;addTile&quot; data-ico=&quot;plus&quot;>사진 더 넣기</button>
    </div>
  </main>
  </div>

  <aside class=&quot;side&quot;>
    <section class=&quot;card&quot;>
      <h2>모든 사진</h2>
      <button type=&quot;button&quot; class=&quot;tog wide&quot; id=&quot;gFlip&quot; data-ico=&quot;flipH&quot;>좌우반전</button>
      <div class=&quot;all-row&quot;>
        <span class=&quot;ctl-label&quot;>비율 늘리기</span>
        <div class=&quot;seg&quot; id=&quot;gStretch&quot; style=&quot;--n:4&quot;></div>
      </div>
      <p class=&quot;hint&quot; id=&quot;gNote&quot;></p>
    </section>

    <section class=&quot;card save&quot;>
      <h2>저장</h2>
      <div class=&quot;frow&quot;>
        <span class=&quot;ctl-label&quot;>형식</span>
        <div class=&quot;seg&quot; style=&quot;--n:3&quot;>
          <button type=&quot;button&quot; data-fmt=&quot;same&quot;>원본과 같게</button>
          <button type=&quot;button&quot; data-fmt=&quot;jpg&quot;>JPG</button>
          <button type=&quot;button&quot; data-fmt=&quot;png&quot;>PNG</button>
        </div>
      </div>
      <div class=&quot;frow&quot;>
        <span class=&quot;ctl-label&quot;>크기</span>
        <div class=&quot;seg&quot; style=&quot;--n:3&quot;>
          <button type=&quot;button&quot; data-size=&quot;0&quot; title=&quot;찍은 크기 그대로&quot;>원본</button>
          <button type=&quot;button&quot; data-size=&quot;2000&quot; title=&quot;긴 쪽을 2000픽셀로 줄임 (블로그용)&quot;>긴 쪽 2000</button>
          <button type=&quot;button&quot; data-size=&quot;1080&quot; title=&quot;긴 쪽을 1080픽셀로 줄임 (인스타용)&quot;>긴 쪽 1080</button>
        </div>
      </div>
      <div class=&quot;frow&quot;>
        <label class=&quot;ctl-label&quot; for=&quot;suffix&quot;>이름</label>
        <input type=&quot;text&quot; class=&quot;txt&quot; id=&quot;suffix&quot; maxlength=&quot;30&quot; placeholder=&quot;원래 이름 뒤에 붙일 글자&quot; autocomplete=&quot;off&quot; title=&quot;원래 파일 이름 뒤에 붙일 글자 (비워 두면 원래 이름 그대로)&quot;>
      </div>
      <p class=&quot;hint&quot; id=&quot;nameEx&quot;></p>
      <div class=&quot;save-btns&quot;>
        <button type=&quot;button&quot; class=&quot;btn primary&quot; id=&quot;zipBtn&quot; data-ico=&quot;down&quot; title=&quot;사진을 ZIP 파일 하나로 묶어서 저장&quot;>ZIP으로 모두 저장</button>
        <button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;eachBtn&quot; title=&quot;사진을 한 장씩 따로따로 저장&quot;>한 장씩 저장</button>
      </div>
      <div class=&quot;prog&quot; id=&quot;prog&quot; hidden><div class=&quot;bar&quot;><i id=&quot;progBar&quot;></i></div><p id=&quot;progTxt&quot;></p></div>
    </section>
  </aside>
</div>

<dialog class=&quot;ed&quot; id=&quot;ed&quot; aria-label=&quot;사진 한 장씩 조정&quot;>
  <div class=&quot;ed-in&quot;>
    <div class=&quot;ed-view&quot;>

/* 자르기 네모 끌기: 가운데 = 옮기기, 모서리·변 = 크기 (비율이 정해져 있으면 모서리만, 비율 유지) */
let cdrag = null;
function dragBox(d, dx, dy) {
  const {x, y, w, h} = d.b, M = 0.04, H = d.h, x2 = x + w, y2 = y + h;
  if (H === 'move') return {x: clamp(x + dx, 0, 1 - w), y: clamp(y + dy, 0, 1 - h), w, h};
  if (!d.ar) {
    let nx = x, ny = y, nw = w, nh = h;
    if (H.includes('w')) { nx = clamp(x + dx, 0, x2 - M); nw = x2 - nx; }
    if (H.includes('e')) nw = clamp(w + dx, M, 1 - x);
    if (H.includes('n')) { ny = clamp(y + dy, 0, y2 - M); nh = y2 - ny; }
    if (H.includes('s')) nh = clamp(h + dy, M, 1 - y);
    return {x: nx, y: ny, w: nw, h: nh};
  }
  const k = d.A / d.ar, sx = H.includes('w') ? -1 : 1, sy = H.includes('n') ? -1 : 1;   // k: 0~1 단위에서 세로 = 가로 × k
  let nw = Math.abs(dx * d.A) >= Math.abs(dy) ? w + sx * dx : (h + sy * dy) / k;
  const maxW = Math.min(sx < 0 ? x2 : 1 - x, (sy < 0 ? y2 : 1 - y) / k);
  nw = clamp(nw, Math.min(M, maxW), maxW);
  const nh = nw * k;
  return {x: sx < 0 ? x2 - nw : x, y: sy < 0 ? y2 - nh : y, w: nw, h: nh};
}
edCbox.addEventListener('pointerdown', e => {
  if (e.button > 0 || !cur || !cur.s.crop) return;
  e.preventDefault();
  const fr = edFrame(), b = cropBox(fr.ow, fr.oh, cur.s.crop);
  cdrag = {h: e.target.dataset.h || 'move', px: e.clientX, py: e.clientY, A: fr.ow / fr.oh, ar: cur.s.crop.ar,
    b: {x: b.x / fr.ow, y: b.y / fr.oh, w: b.w / fr.ow, h: b.h / fr.oh}, rect: edCrop.getBoundingClientRect()};
  edCbox.setPointerCapture(e.pointerId);
});
edCbox.addEventListener('pointermove', e => {

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => edCbox.addEventListener(t, () => { if (!cdrag) return; cdrag = null; edSync(); refreshUI(); }));

/* 가리기 그리기: 화면에서 그린 모양을 원본 사진 기준 위치로 바꿔 저장 (반전·기울기를 거꾸로 계산)
   좌표는 화면에 보이는 사진 기준 (사진 밖이면 음수이거나 사진 크기보다 큼) */
let dr = null;
function photoRect() {   // 화면에 보이는 사진 자리 (창 기준 좌표)
  const st = edStage.getBoundingClientRect();
  return {left: st.left + photoBox.left, top: st.top + photoBox.top, width: photoBox.w, height: photoBox.h};
}
function viewToSrc(vx, vy, r) {
  const src = edSrc(), s = cur.s, g = geom(src.width, src.height, s), th = s.rot * Math.PI / 2 + g.t;
  // 화면에는 자른 부분(+ 비율 늘리기)이 보이므로 보이는 부분 기준으로 되돌림
  const reg = !cropping &amp;&amp; s.crop ? cropBox(g.ow, g.oh, s.crop) : {x: 0, y: 0, w: g.ow, h: g.oh};
  const dx = reg.x + vx / r.width * reg.w - g.ow / 2, dy = reg.y + vy / r.height * reg.h - g.oh / 2, c = Math.cos(th), sn = Math.sin(th);
  let x = dx * c + dy * sn, y = -dx * sn + dy * c;

  y /= s.flipV ? -g.k : g.k;
  const L = Math.max(src.width, src.height), r4 = v => Math.round(v * 1e4) / 1e4;

  return {x: r4((x + src.width / 2) / L), y: r4((y + src.height / 2) / L), fx: reg.w / r.width / g.k / L, fy: reg.h / r.height / g.k / L, th};

function sizeBrushCur() { edBrush.style.width = edBrush.style.height = brushPx + 'px'; }
function moveBrushCur(e) {
  if (tool !== 'brush' &amp;&amp; tool !== 'erase') { edBrush.hidden = true; return; }
  const r = edDraw.getBoundingClientRect();
  sizeBrushCur();
  edBrush.classList.toggle('erase', tool === 'erase');
  edBrush.style.left = e.clientX - r.left + 'px';
  edBrush.style.top = e.clientY - r.top + 'px';
  edBrush.hidden = false;
}
function shapeRect(d, vx, vy, sq) {   // 끈 자리 → 화면 네모 (Shift = 정사각형·정원)
  const x1 = d.x0, y1 = d.y0;
  let x2 = clamp(vx, 0, d.r.width), y2 = clamp(vy, 0, d.r.height);
  if (sq) { const m = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)); x2 = x1 + Math.sign(x2 - x1 || 1) * m; y2 = y1 + Math.sign(y2 - y1 || 1) * m; }
  return {l: Math.min(x1, x2), t: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1)};
}
function showShape(d, vx, vy, sq) {
  const b = shapeRect(d, vx, vy, sq), ox = photoBox.left - drawBox.left, oy = photoBox.top - drawBox.top;   // 사진 기준 → 그리기 판 기준
  Object.assign(edShape.style, {left: ox + b.l + 'px', top: oy + b.t + 'px', width: b.w + 'px', height: b.h + 'px'});
  edShape.hidden = false;
}
edDraw.addEventListener('pointerdown', e => {
  if (e.button > 0 || !cur || !tool) return;
  e.preventDefault();
  if (tool === 'erase' &amp;&amp; !cur.s.fx) return;
  placeOverlays();
  const r = photoRect(), vx = e.clientX - r.left, vy = e.clientY - r.top;
  edDraw.setPointerCapture(e.pointerId);
  if (tool === 'rect' || tool === 'ellipse') {
    dr = {kind: tool, x0: clamp(vx, 0, r.width), y0: clamp(vy, 0, r.height), r};   // 네모·동그라미는 사진 안으로 맞춤
    edShape.classList.toggle('e', tool === 'ellipse');
    showShape(dr, vx, vy, e.shiftKey);
  } else {
    const p = viewToSrc(vx, vy, r), st = {t: 'b', e: tool === 'erase' ? 1 : 0, r: Math.round(brushPx / 2 * (p.fx + p.fy) / 2 * 1e5) / 1e5, pts: [[p.x, p.y]]};
    cur.s = {...cur.s, fx: [...(cur.s.fx || []), st]};
    dr = {kind: 'brush', stroke: st, r, lx: vx, ly: vy};

});
edDraw.addEventListener('pointermove', e => {
  moveBrushCur(e);
  if (!dr) return;
  const vx = e.clientX - dr.r.left, vy = e.clientY - dr.r.top;
  if (dr.kind !== 'brush') { showShape(dr, vx, vy, e.shiftKey); return; }
  if (Math.hypot(vx - dr.lx, vy - dr.ly) < 2) return;
  dr.lx = vx; dr.ly = vy;
  const p = viewToSrc(vx, vy, dr.r);
  dr.stroke.pts.push([p.x, p.y]);
  edRepaint(); cardSoon(cur);
});
function drawEnd(e, commit) {
  if (!dr) return;
  const d = dr;
  dr = null;
  if (d.kind === 'brush') { edSync(); refreshUI(); return; }
  edShape.hidden = true;
  if (!commit || !cur) return;
  const b = shapeRect(d, e.clientX - d.r.left, e.clientY - d.r.top, e.shiftKey);
  if (b.w < 6 || b.h < 6) return;
  const c = viewToSrc(b.l + b.w / 2, b.t + b.h / 2, d.r), s = cur.s, r4 = v => Math.round(v * 1e4) / 1e4;
  const a = s.flipH !== s.flipV ? c.th : -c.th;   // 화면에서 그린 그대로(반듯하게) 보이게 반대로 돌려 둠
  edApi.set({fx: [...(s.fx || []), {t: d.kind === 'ellipse' ? 'e' : 'r', x: c.x, y: c.y, w: r4(b.w * c.fx), h: r4(b.h * c.fy), a: r4(a)}]});

edDraw.addEventListener('pointerup', e => drawEnd(e, true));
edDraw.addEventListener('pointercancel', e => drawEnd(e, false));
edDraw.addEventListener('lostpointercapture', e => drawEnd(e, false));
edDraw.addEventListener('pointerleave', () => { if (!dr) edBrush.hidden = true; });
edDraw.addEventListener('wheel', e => {   // 붓·지우개일 때 휠 = 붓 크기

/* ── 저장 ── */
const fmtBtns = document.querySelectorAll('[data-fmt]'), sizeBtns = document.querySelectorAll('[data-size]');
function syncSave() {
  fmtBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fmt === fmt)));
  sizeBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.size === size)));
}
fmtBtns.forEach(b => b.onclick = () => { fmt = b.dataset.fmt; persist(); syncSave(); refreshUI(); });
sizeBtns.forEach(b => b.onclick = () => { size = +b.dataset.size; persist(); syncSave(); });
suffixIn.value = suffix;
suffixIn.oninput = () => { suffix = suffixIn.value.replace(/[\\/:*?&quot;<>|]/g, ''); persist(); refreshUI(); };

function outMime(file) {
  if (fmt === 'jpg') return 'image/jpeg';
  if (fmt === 'png') return 'image/png';
  const t = (file.type || '').toLowerCase(), n = file.name || '';
  if (t === 'image/png' || /\.png$/i.test(n)) return 'image/png';
  if (t === 'image/webp' || /\.webp$/i.test(n)) return 'image/webp';
  return 'image/jpeg';
}
function outName(name, mime) {
  const base = name.replace(/\.[^.]+$/, '') || '사진';
  return (base + suffix).replace(/[\\/:*?&quot;<>|]/g, '_') + EXT[mime];
}

/* 저장용 처리(보정+반전+자르기+JPG 변환)는 백그라운드(워커)에서 여러 장 동시에 — 화면이 안 멈추고 훨씬 빠름. 안 되면 화면에서 처리 */
const ENC_SRC = [mkCv, geom, cropBox, blurData, toneStep, fxLayer, fxMask, composeFx, develop, paintGeom, stretchDims, stretchCv, render].map(String).join('\n')
  + '\nonmessage=async e=>{const d=e.data;try{const c=new OffscreenCanvas(1,1);render(c,d.bmp,d.bmp.width,d.bmp.height,d.s,d.bg);d.bmp.close();'
  + 'postMessage({id:d.id,b:await c.convertToBlob({type:d.type,quality:d.q})})}catch(err){postMessage({id:d.id,err:String(err)})}}';
let workers = null, workerBroken = false, encSeq = 0;
function getWorkers() {
  if (workerBroken) return [];
  if (!workers) {
    workers = [];
    try {
      if (typeof OffscreenCanvas !== 'function' || !OffscreenCanvas.prototype.convertToBlob) throw 0;
      const url = URL.createObjectURL(new Blob([ENC_SRC], {type: 'text/javascript'}));
      const n = clamp((navigator.hardwareConcurrency || 4) - 1, 1, 3);
      for (let i = 0; i < n; i++) workers.push(new Worker(url));
    } catch (e) { workers = []; workerBroken = true; }
  }
  return workers;
}
function workerRun(w, msg, transfer) {
  return new Promise((res, rej) => {
    const id = ++encSeq;
    const done = (fn, v) => { clearTimeout(tm); w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); fn(v); };
    const onMsg = e => { if (e.data.id !== id) return; e.data.b ? done(res, e.data.b) : done(rej, new Error(e.data.err)); };
    const onErr = e => { e.preventDefault(); done(rej, new Error('worker')); };
    const tm = setTimeout(() => done(rej, new Error('timeout')), 60000);
    w.addEventListener('message', onMsg);
    w.addEventListener('error', onErr);
    w.postMessage({...msg, id}, transfer);
  });
}
async function renderFull(it, worker) {
  const img = await decode(it.file), mime = outMime(it.file), s = {...it.s}, bg = mime === 'image/jpeg';
  const nw = img.naturalWidth, nh = img.naturalHeight, g = geom(nw, nh, s), b = cropBox(g.ow, g.oh, s.crop);
  const sc = size ? Math.min(1, size / Math.max(b.w, b.h)) : 1;   // 크기: 결과 사진(자른 뒤)의 긴 쪽 기준
  const w = Math.max(1, Math.round(nw * sc)), h = Math.max(1, Math.round(nh * sc));
  const prep = () => { const c = mkCv(w, h), x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h); return c; };
  let blob = null;
  if (worker &amp;&amp; !workerBroken) {
    try {
      const c = prep(), bmp = await createImageBitmap(c);
      c.width = c.height = 0;
      blob = await workerRun(worker, {bmp, s, bg, type: mime, q: 0.92}, [bmp]);
    } catch (e) { workerBroken = true; blob = null; }

  if (!blob) {
    const src = sc < 1 ? prep() : img;
    const cv = render(mkCv(1, 1), src, w, h, s, bg);
    blob = await new Promise(r => cv.toBlob(r, mime, 0.92));
    cv.width = cv.height = 0;

}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
function uniq(name, used) {
  let n = name, i = 2;
  while (used.has(n.toLowerCase())) n = name.replace(/(\.[^.]+)$/, ` (${i++})$1`);
  used.add(n.toLowerCase());

async function saveOne(it) {
  try {
    const r = await renderFull(it, getWorkers()[0]);
    download(r.blob, r.name);
    toast(`저장했어요 · ${r.name}`);
  } catch (e) { toast('이 사진은 저장하지 못했어요. 사진이 너무 크면 PNG 대신 JPG로 해 보세요.', 4200); }
}
function showProg(done, total, text) {
  prog.hidden = false;
  progBar.style.width = (total ? done / total * 100 : 0) + '%';
  progTxt.textContent = text || `만드는 중… ${done} / ${total}`;
  edSaveAll.lastChild.textContent = text ? '저장 중…' : `저장 중 ${done}/${total}`;
}
async function saveAll(zip) {
  const list = items.filter(i => i.ready);
  if (!list.length || saving) return;
  saving = true; refreshUI();
  if (!zip) toast('크롬이 &quot;여러 파일 다운로드&quot;를 물으면 허용을 눌러 주세요', 4200);
  const W = getWorkers(), results = [], used = new Set();
  let next = 0, doneN = 0;
  showProg(0, list.length);
  const lane = async w => {   // 여러 장을 동시에 (워커 하나당 한 줄)
    while (next < list.length) {
      const i = next++;
      try { results[i] = await renderFull(list[i], w); } catch (e) { results[i] = null; }
      showProg(++doneN, list.length);
    }
  };
  await Promise.all(W.length ? W.map(lane) : [lane(), lane()]);
  const out = results.filter(Boolean);
  out.forEach(r => { r.name = uniq(r.name, used); });
  const fail = list.length - out.length, okN = out.length;
  if (!zip) {
    for (let i = 0; i < out.length; i++) {
      showProg(i + 1, out.length, `내려받는 중… ${i + 1} / ${out.length}`);
      download(out[i].blob, out[i].name);
      await sleep(350);
    }

  if (zip &amp;&amp; out.length) {
    showProg(list.length, list.length, 'ZIP 파일로 묶는 중…');
    const t = new Date(), ymd = t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0');
    download(await makeZip(out), `사진_${out.length}장_${ymd}.zip`);
  }
  showProg(list.length, list.length, okN ? `${okN}장 저장 완료` + (fail ? ` · ${fail}장 실패` : '') : '저장하지 못했어요');
  saving = false; refreshUI();
  if (fail) toast(`${fail}장은 저장하지 못했어요. 너무 큰 사진이면 JPG로 해 보세요.`, 4200);
  else if (okN) toast(`${okN}장 저장했어요`);
}
zipBtn.onclick = () => saveAll(true);
eachBtn.onclick = () => saveAll(false);

/* ZIP 만들기 (압축 없이 묶기만 — 사진은 이미 압축돼 있어서 크기 차이 없음) */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c &amp; 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) &amp; 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0, cdSize = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(new Uint8Array(await f.blob.arrayBuffer())), sz = f.blob.size;

    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true);

    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, nm);
    offset += 30 + nm.length + sz;
    cdSize += 46 + nm.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], {type: 'application/zip'});
}

/* ── 알림 ── */
const toastEl = $('#toast');
let toastT = 0;
function toast(msg, ms = 2600) {
  const host = ed.open ? ed : document.body;   // 조정 창이 열려 있으면 창 안에 띄움
  if (toastEl.parentNode !== host) host.appendChild(toastEl);
  toastEl.textContent = msg;
  void toastEl.offsetWidth;   // 옮긴 직후에도 나타나는 효과가 보이게
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), ms);
}

syncG();
syncSave();
refreshUI();

  <iframe id="f-calc" title="G-MAT 견적 계산기" allow="clipboard-read; clipboard-write; web-share" hidden data-src="<!doctype html>
<html lang=&quot;ko&quot;>
<head>

<title>G-MAT 견적 계산기</title>
<link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css&quot;>
<style>
/* 색: 그레이·블랙·그린 (시공 계산기와 같은 계열) — 고르는 칸은 초록, 제목·글씨는 검정 */
:root{
  --ground:#F2F3F1;--paper:#FFFFFF;--sand:#E4E7E3;--line:#DCDFDB;--ink:#1D211F;--muted:#6B716D;
  --brown:#3C4440;--brown-deep:#1D211F;--green:#1E7A52;--green-deep:#165F3F;--green-soft:#E3F1E9;--bad:#C0392B;--radius:16px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;word-break:keep-all;color-scheme:light}
button,input{font:inherit;color:inherit}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,opacity .15s}
.btn:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-deep)}
.btn.primary.done{background:var(--brown-deep);border-color:var(--brown-deep)}
.btn.dark{background:var(--brown-deep);border-color:var(--brown-deep);color:#fff}
.btn.dark:hover{background:#000}
.btn.add{width:100%;height:44px;border-style:dashed;color:var(--brown-deep);background:transparent;margin-top:12px}
.btn.add:hover{background:#fff}

/* 휴대폰 폭 한 줄 — PC에서도 같은 폭으로 가운데에 */
.top,.tabs,.wrap{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:18px 16px 4px}
.top img{height:40px;width:auto}
.top h1{font-size:18px;margin:0;color:var(--brown-deep);line-height:1.3}
.top p{margin:0;font-size:13px;color:var(--muted)}
.wrap{padding:12px 16px 32px;display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}

/* 탭 */
.tabs{padding:10px 16px 0}
.tabs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sand);padding:4px;border-radius:12px}
.tabs button{height:42px;padding:0;border:0;background:none;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 1) 직접 계산: 이름 | 가로 | × | 세로 | 삭제 */
.rows-head,.row{display:grid;grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr) 34px;gap:6px;align-items:center}
.rows-head{font-size:12px;color:var(--muted);padding:0 2px 6px;border-bottom:1px solid var(--line)}
.rows-head span:nth-child(1),.rows-head span:nth-child(3){text-align:center}
.row{padding:8px 0;border-bottom:1px solid var(--line)}
input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:16px}
input:focus{outline:2px solid var(--brown);outline-offset:-1px;border-color:var(--brown)}
.num{text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row .num.need{border-color:#E0B84C;background:#FFF7E3}
.row .x{text-align:center;color:var(--muted)}
.row .del{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.row .del:hover{background:var(--sand);color:var(--bad)}
.total{margin:12px 2px 0;display:flex;justify-content:flex-end;font-size:13px;color:var(--muted)}
.total b{color:var(--ink);font-variant-numeric:tabular-nums}

/* 2) 평형별 견적: 평형 | 거복 | 거복아 | 거복주 */
.py-grid{display:grid;grid-template-columns:78px repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.py-h{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.py-name{font-size:14px;font-weight:700;line-height:1.25}
.py-cell{height:50px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .15s,border-color .15s}
.py-cell:hover{border-color:var(--brown)}
.py-cell[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.py-none{height:50px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:10px;color:#B7BDB9}
.legend{margin:12px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.7}
.legend b{color:var(--ink)}

/* 3) 수량 입력: 매트 | 수량 | 장 */
.qty-in{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty-in b{display:block;font-size:16px}
.qty-in small{display:block;font-size:12px;color:var(--muted)}
.qty-in > span:last-child{font-weight:700;color:var(--muted)}
.qty-in input.auto{background:var(--green-soft);border-color:#CBD9CD;color:var(--green);font-weight:700}

/* 4) 상담 문구 — 누르면 바로 복사 */
.talk{display:grid;gap:8px}
.talk-item{display:grid;gap:4px;width:100%;padding:12px 14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .15s}
.talk-item:hover{border-color:var(--brown)}
.talk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.talk-top b{font-size:15px}
.talk-top em{flex:none;font-style:normal;font-size:12.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:3px 10px;border-radius:999px}
.talk-pre{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.talk-item.done{border-color:var(--green)}
.talk-item.done em{background:var(--green);color:#fff}

/* 시공 지역 — 견적서 안내 문구가 지역별로 바뀜 */
.region{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:10px 12px}
.region > span{font-size:13px;font-weight:700;color:var(--brown-deep);padding-left:4px}
.region-in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sand);padding:4px;border-radius:10px}
.region-in button{height:36px;border:0;background:none;border-radius:7px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.region-in button:hover{color:var(--ink)}
.region-in button[aria-pressed=true]{background:var(--green);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* 견적서 */
.quote{position:relative;background:#fff;box-shadow:0 2px 12px rgba(80,60,40,.06);padding:20px 18px 18px}
.doc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc-head img{height:30px;width:auto}
.doc-head time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:36px}
.quote .doc-title{display:block;margin:14px 0 0;padding-bottom:12px;text-align:center;font-size:21px;font-weight:800;letter-spacing:.35em;text-indent:.35em;color:var(--ink);border-bottom:3px double var(--ink)}
.doc-scope{margin:12px 0 0;text-align:center;font-size:14.5px;font-weight:700;color:var(--brown-deep)}
.qt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.qt th,.qt td{padding:10px 4px;text-align:right;white-space:nowrap}
.qt th:first-child,.qt td:first-child{text-align:left;padding-left:2px}
.qt th:last-child,.qt td:last-child{padding-right:2px}
.qt thead th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--ink)}
.qt tbody td{font-size:14.5px;border-bottom:1px solid var(--line)}
.qt tbody tr:last-child td{border-bottom:3px double var(--ink)}
.qt .item b{display:block;font-size:15px}
.qt .item small{display:block;font-size:12px;color:var(--muted)}
.qt .amt{font-weight:800;color:var(--green);font-size:15.5px}
.qt.np th:nth-child(n+3),.qt.np td:nth-child(n+3){display:none}
.doc-note{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6;white-space:pre-line}
.doc-foot{margin:14px 0 0;text-align:right;font-size:14px;font-weight:800;color:var(--brown-deep);letter-spacing:.04em}

/* 단가 설정 — 톱니바퀴로 열고 닫음 (고객에게 화면 보여줄 때는 접어두기) */
.gear{position:absolute;top:14px;right:12px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:#9AA19C;cursor:pointer}
.gear:hover,.gear.on{background:var(--sand);color:var(--brown-deep)}
.gear svg{width:18px;height:18px}
.prices{background:var(--ground);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 16px;display:grid;gap:8px}
.prices-head{display:flex;justify-content:space-between;align-items:center;margin:0;padding-right:36px;font-size:13px;color:var(--brown-deep)}
.prices-head button{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.price{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.price input{height:40px}

/* 복사 · 저장 */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reset{background:none;border:0;padding:4px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px;justify-self:center}
.reset:hover{color:var(--bad)}

/* 견적서 이미지 미리보기 */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(30,25,20,.6);overflow-y:auto;padding:20px 16px}
.sheet-box{max-width:480px;margin:0 auto;background:var(--paper);border-radius:16px;padding:16px;display:grid;gap:12px}
.sheet-box h2{margin:0;font-size:15px;color:var(--brown-deep)}
.sheet-box img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.sheet .hint{margin:0;font-size:12.5px;color:var(--muted)}
</style>

function save() {
  const data = [...rowsEl.children].map(r => ({ w: r.querySelector('.w').value, h: r.querySelector('.h').value }));
  try {
    localStorage.setItem(STORE, JSON.stringify(data));
    localStorage.setItem(PRICE_STORE, JSON.stringify(MATS.map(m => m.p.value)));
    localStorage.setItem(UI_STORE, JSON.stringify({ tab, py: pySel, region, n: MATS.map(m => m.n.value), src: qtySrc }));
  } catch (e) {}
}
function load() {
  try {
    const p = JSON.parse(localStorage.getItem(PRICE_STORE));
    if (Array.isArray(p)) MATS.forEach((m, i) => { m.p.value = p[i] || ''; });
    const ui = JSON.parse(localStorage.getItem(UI_STORE));
    if (ui) {
      if (TABS[ui.tab]) tab = ui.tab;
      if (REGIONS[ui.region]) region = ui.region;
      if (ui.py &amp;&amp; PY_TABLE[ui.py.i] &amp;&amp; PY_TABLE[ui.py.i].q[ui.py.k]) pySel = ui.py;
      if (Array.isArray(ui.n)) MATS.forEach((m, i) => { m.n.value = ui.n[i] || ''; });
      if (ui.src === 1) qtySrc = 1;
    }
    const d = JSON.parse(localStorage.getItem(STORE));
    if (Array.isArray(d) &amp;&amp; d.length) return d;
  } catch (e) {}
  return emptyRows();
}

function addRow(r = { w: '', h: '' }) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <input class=&quot;num w&quot; type=&quot;number&quot; inputmode=&quot;numeric&quot; min=&quot;0&quot; placeholder=&quot;0&quot; enterkeyhint=&quot;next&quot;>

    <button class=&quot;del&quot; type=&quot;button&quot;>×</button>`;
  row.querySelector('.w').value = r.w;
  row.querySelector('.h').value = r.h;
  rowsEl.appendChild(row);
  return row;
}

function directQuote() {
  let area = 0, total50 = 0, count = 0;
  [...rowsEl.children].forEach((row, i) => {
    const name = `${i + 1}번째 줄`;
    const wEl = row.querySelector('.w'), hEl = row.querySelector('.h');
    const w = num(wEl.value), h = num(hEl.value);
    wEl.setAttribute('aria-label', `${name} 가로(cm)`);
    hEl.setAttribute('aria-label', `${name} 세로(cm)`);
    row.querySelector('.del').setAttribute('aria-label', `${name} 줄 삭제`);
    // 한쪽만 넣었으면 빈 칸을 표시
    wEl.classList.toggle('need', !w &amp;&amp; !!h);
    hEl.classList.toggle('need', !!w &amp;&amp; !h);
    if (w &amp;&amp; h) { area += w * h / 10000; total50 += mats50(w, h); count++; }
  });

}

/* ===== 3) 수량 입력 — 한쪽을 넣으면 다른 쪽은 평형별 표의 G-80 : G-100 짝으로 자동 계산 =====
   표에 있는 수량은 표 그대로, 사이 값은 앞뒤 표 값 사이를 비례해서, 표 밖은 끝 값의 비율로 */
const PAIRS = [...new Map(PY_TABLE.flatMap(p => Object.values(p.q))).entries()].sort((a, b) => a[0] - b[0]);
function convert(v, from) { // from 0: G-80 → G-100, 1: G-100 → G-80
  const pts = PAIRS.map(p => from ? [p[1], p[0]] : p).sort((a, b) => a[0] - b[0]);
  const first = pts[0], last = pts[pts.length - 1];
  if (v <= first[0]) return Math.max(1, Math.round(v * first[1] / first[0]));
  if (v >= last[0]) return Math.round(v * last[1] / last[0]);
  const k = pts.findIndex(p => p[0] >= v), [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
  return x1 === x0 ? y1 : Math.round(y0 + (v - x0) * (y1 - y0) / (x1 - x0));
}

/* ===== 견적서 이미지 (사진첩 저장용) ===== */
const FONT = '&quot;Pretendard Variable&quot;, Pretendard, -apple-system, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif';
const font = (w, s) => `${w} ${s}px ${FONT}`;
const C = { ink: '#2C2925', muted: '#7B7167', brown: '#6F5240', green: '#2E5B45', head: '#F5EFE7', rule: '#E3D8C8', frame: '#D8C8B4' };

// 띄어쓰기 기준 줄바꿈
function wrapText(x, text, maxW) {
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    const t = line ? `${line} ${word}` : word;
    if (!line || x.measureText(t).width <= maxW) line = t; else { lines.push(line); line = word; }
  }
  if (line) lines.push(line);
  return lines;
}
// 글자 사이를 띄워서 가운데 정렬 (제목용)
function spaced(x, text, cx, y, gap) {
  const ws = [...text].map(ch => x.measureText(ch).width);
  let left = cx - (ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1)) / 2;
  x.textAlign = 'left';
  [...text].forEach((ch, i) => { x.fillText(ch, left, y); left += ws[i] + gap; });
}

async function drawQuote(q) {
  const W = 1080, P = 80, IW = W - P * 2;
  const hasPrice = MATS.some(m => won(m.p)), items = itemsOf(q);
  const notes = [...(items.length > 1 ? [CHOICE] : []), REGIONS[region].note, NOTE];
  // 글꼴을 다 받은 뒤에 그림 (인터넷이 안 되면 2초 뒤 기본 글꼴로)
  const used = ['견적서견적일자아래와 같이 견적합니다.상호대표자사업자번호대표번호견적 내역품목규격수량단가(원)금액(원)장-0123456789,.×()·', notes.join(''), Object.values(COMPANY).join(''), MATS.map(m => m.label + m.size).join('')].join('');
  try { await Promise.race([document.fonts.load(font(700, 30), used), new Promise(r => setTimeout(r, 2000))]); } catch (e) {}

  const c = document.createElement('canvas');
  c.width = W; c.height = 2600;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, c.height);
  x.textBaseline = 'middle';
  let y = P;

  // 로고 · 견적일자
  const logo = $('#logo');
  if (!logo.naturalWidth) await logo.decode().catch(() => {});
  const lh = 96, lw = lh * logo.naturalWidth / logo.naturalHeight || 0;
  x.drawImage(logo, P, y, lw, lh);
  x.fillStyle = C.muted; x.font = font(500, 26); x.textAlign = 'right';
  x.fillText(`견적일자  ${DATE}`, W - P, y + lh - 14);
  y += lh + 60;

  // 제목
  x.fillStyle = C.ink; x.font = font(800, 84);
  spaced(x, '견적서', W / 2, y, 56);
  y += 62;
  x.fillRect(W / 2 - 200, y, 400, 4);
  x.fillRect(W / 2 - 200, y + 10, 400, 2);
  y += 86;

  x.textAlign = 'left'; x.fillStyle = C.muted; x.font = font(500, 27);
  x.fillText('아래와 같이 견적합니다.', P, y);
  y += 38;

  // 정보 표: 업체 정보만 (시공 지역·범위는 넣지 않음). [이름, 값] 한 쌍이면 한 줄 전체, 두 쌍이면 반씩
  const LW = 168, VW2 = (IW - LW * 2) / 2;
  const info = [
    [['상호', COMPANY.name], ['대표자', COMPANY.ceo]],
    [['사업자번호', COMPANY.bizNo], ['대표번호', COMPANY.tel]]
  ];
  x.fillStyle = C.ink; x.fillRect(P, y, IW, 3);
  y += 3;
  for (const row of info) {
    x.font = font(500, 27);
    const vw = row.length === 1 ? IW - LW : VW2;
    const lines = row.map(([, v]) => wrapText(x, v, vw - 36));
    const rh = Math.max(...lines.map(l => l.length)) * 40 + 32;
    let cx = P;
    row.forEach(([label], j) => {
      x.fillStyle = C.head; x.fillRect(cx, y, LW, rh);
      x.fillStyle = C.brown; x.font = font(600, 25); x.textAlign = 'center';
      x.fillText(label, cx + LW / 2, y + rh / 2);
      x.fillStyle = C.ink; x.font = font(500, 27); x.textAlign = 'left';
      const ls = lines[j], top = y + rh / 2 - (ls.length - 1) * 20;
      ls.forEach((l, k) => x.fillText(l, cx + LW + 18, top + k * 40));
      cx += LW + vw;
      if (j < row.length - 1) { x.fillStyle = C.rule; x.fillRect(cx, y, 1.5, rh); }
    });
    y += rh;
    x.fillStyle = C.rule; x.fillRect(P, y, IW, 1.5);
  }
  x.fillStyle = C.ink; x.fillRect(P, y, IW, 3);
  y += 78;

  // 견적 내역 표
  x.fillStyle = C.brown; x.font = font(800, 30); x.textAlign = 'left';
  x.fillText('견적 내역', P, y);
  y += 38;
  const cols = hasPrice
    ? [['품목', 170, 'left'], ['규격', 210, 'center'], ['수량', 150, 'right'], ['단가(원)', 180, 'right'], ['금액(원)', IW - 710, 'right']]
    : [['품목', 300, 'left'], ['규격', 330, 'center'], ['수량', IW - 630, 'right']];
  const cellX = (k, align) => {
    const left = P + cols.slice(0, k).reduce((a, col) => a + col[1], 0);
    return align === 'left' ? left + 20 : align === 'right' ? left + cols[k][1] - 20 : left + cols[k][1] / 2;
  };
  x.fillStyle = C.ink; x.fillRect(P, y, IW, 3);
  y += 3;
  x.fillStyle = C.head; x.fillRect(P, y, IW, 66);
  x.font = font(600, 25); x.fillStyle = C.brown;
  cols.forEach(([t, , align], k) => { x.textAlign = align; x.fillText(t, cellX(k, align), y + 33); });
  y += 66;
  x.fillStyle = C.ink; x.fillRect(P, y, IW, 1.5);
  items.forEach(({ m, qty, price }, i) => {
    const RH = 96, mid = y + RH / 2;
    const cells = [
      [m.label, font(800, 32), C.ink],
      [m.size, font(500, 28), C.ink],
      [`${fmt(qty)}장`, font(600, 30), C.ink],
      [price ? fmt(price) : '-', font(500, 28), C.ink],
      [price ? fmt(qty * price) : '-', font(800, 32), C.green]
    ].slice(0, cols.length);
    cells.forEach(([t, f, color], k) => { x.font = f; x.fillStyle = color; x.textAlign = cols[k][2]; x.fillText(t, cellX(k, cols[k][2]), mid); });
    y += RH;
    if (i < items.length - 1) { x.fillStyle = C.rule; x.fillRect(P, y, IW, 1.5); }
  });
  x.fillStyle = C.ink; x.fillRect(P, y, IW, 3); x.fillRect(P, y + 9, IW, 1.5);
  y += 52;

  // 안내 문구
  x.font = font(400, 25); x.fillStyle = C.muted; x.textAlign = 'left';
  for (const t of notes) {
    for (const l of wrapText(x, t, IW)) { x.fillText(l, P, y); y += 38; }
    y += 4;
  }
  y += 50;

  // 맺음: 업체 이름
  x.textAlign = 'center';
  x.fillStyle = C.brown; x.font = font(800, 40);
  spaced(x, 'G-MAT 지매트', W / 2, y, 2);
  y += 50;
  x.fillStyle = C.muted; x.font = font(500, 24); x.textAlign = 'center';
  x.fillText(`대표번호 ${COMPANY.tel}  ·  ${COMPANY.site}`, W / 2, y);
  y += 20 + P;

  // 길이에 맞게 자르고 테두리
  const out = document.createElement('canvas');
  out.width = W; out.height = Math.round(y);
  const o = out.getContext('2d');
  o.drawImage(c, 0, 0);
  o.strokeStyle = C.frame; o.lineWidth = 3; o.strokeRect(30, 30, W - 60, out.height - 60);
  o.lineWidth = 1.5; o.strokeRect(42, 42, W - 84, out.height - 84);
  return out;
}

/* 견적이 바뀌면 이미지를 미리 만들어 둠 — 아이폰 공유 창은 버튼 누르자마자 열어야 해서 */
let imgCache = { key: '' }, imgTimer;
const imgKey = q => JSON.stringify([q.qty, q.scope, region, MATS.map(m => won(m.p)), DATE]);
async function buildImage(q) {
  const key = imgKey(q);
  if (imgCache.key === key) return imgCache;
  const canvas = await drawQuote(q);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], `G-MAT_견적서_${q.file ? q.file + '_' : ''}${DATE8}.png`, { type: 'image/png' });
  return (imgCache = { key, file, url: canvas.toDataURL('image/png') });
}
function prepImage() {
  clearTimeout(imgTimer);
  if (cur.has) imgTimer = setTimeout(() => buildImage(cur).catch(() => {}), 400);
}

/* 견적서 저장: 아이폰은 바로 공유 창(→ 이미지 저장), 그 밖은 바로 내려받기 (안드로이드는 갤러리 Download 앨범) */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' &amp;&amp; navigator.maxTouchPoints > 1);
function flashImg(msg) {
  imgBtn.textContent = msg;
  clearTimeout(imgBtn.t);
  imgBtn.t = setTimeout(() => { imgBtn.textContent = '견적서 저장'; }, 2000);
}
imgBtn.addEventListener('click', async () => {
  if (!cur.has) return;
  let img = imgCache.key === imgKey(cur) ? imgCache : null;
  if (!img) {
    imgBtn.disabled = true; imgBtn.textContent = '만드는 중…';
    try { img = await buildImage(cur); } finally { imgBtn.disabled = !cur.has; imgBtn.textContent = '견적서 저장'; }
  }
  if (IS_IOS) {
    if (navigator.canShare &amp;&amp; navigator.canShare({ files: [img.file] })) {
      try { await navigator.share({ files: [img.file] }); }
      catch (e) { if (e.name !== 'AbortError') showSheet(img.url); } // 공유 창이 안 열리면 꾹 눌러 저장하는 화면으로
    } else showSheet(img.url); // 카톡 안 브라우저처럼 공유가 안 되는 곳
    return;
  }
  const url = URL.createObjectURL(img.file), a = document.createElement('a');
  a.href = url; a.download = img.file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  flashImg('저장됐어요 ✓');
});

/* ===== 복사 (견적 · 상담 문구 공통) ===== */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  // 복사 기능이 막힌 화면에서는 예전 방식으로
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
copyBtn.addEventListener('click', async () => {
  if (!cur.has) return;
  const ok = await copyText(quoteText(cur));
  copyBtn.textContent = ok ? '복사됐어요 ✓' : '복사가 안 됐어요';
  copyBtn.classList.toggle('done', ok);

  m.p.addEventListener('input', () => { // 숫자만 받고 쉼표를 붙여서 보여줌
    const n = won(m.p);
    m.p.value = n ? fmt(n) : '';
    update();
  });
  m.p.addEventListener('keydown', e => { if (e.key === 'Enter') m.p.blur(); });
});
/* 단가 설정 열고 닫기 — 단가가 저장돼 있으면 처음엔 접힌 채로 시작 */
const gearBtn = $('#gearBtn'), pricesEl = $('#prices');
function setPrices(open) {
  pricesEl.hidden = !open;
  gearBtn.setAttribute('aria-expanded', open);
  gearBtn.classList.toggle('on', open);
}
gearBtn.addEventListener('click', () => setPrices(pricesEl.hidden));
$('#pricesDone').addEventListener('click', () => setPrices(false));

load().forEach(addRow);
MATS.forEach(m => { const n = won(m.p); m.p.value = n ? fmt(n) : ''; });
setPrices(!MATS.some(m => won(m.p)));
markPy();
markRegion();
markAuto();
setTab(tab);
</script>

<script>
/* 메뉴: 고른 도구만 보이고, 처음 열 때 그 도구를 불러옴 (안 쓰는 도구는 안 불러서 빠름)
   주소 끝 #photo · #calc 로 바로 열 수 있음, #thumbnail 은 로고 도구의 블로그 썸네일 */
const FIRST = 'logo';
const tabs = document.querySelectorAll('.gt-nav [data-t]');
function show(t, sub) {
  const f = document.getElementById('f-' + t);
  if (!f) return show(FIRST);
  if (!f.srcdoc) {
    if (sub) f.addEventListener('load', () => { try { f.contentWindow.showTab(sub); } catch (e) {} }, {once: true});
    f.srcdoc = f.dataset.src;
  } else if (sub) { try { f.contentWindow.showTab(sub); } catch (e) {} }
  document.querySelectorAll('.gt-frames iframe').forEach(x => { x.hidden = x !== f; });
  tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  try { history.replaceState(null, '', t === FIRST ? location.pathname + location.search : '#' + t); } catch (e) {}
  f.focus();
}
tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.t)));
const h = location.hash.slice(1);
if (h === 'thumbnail') show('logo', 'thumb'); else show(h || FIRST);
</script>
