<style>
/* 색: 그레이·블랙·그린 (시공 계산기와 같은 계열) — 고르는 칸은 초록, 제목·글씨는 검정 */
:root{
  --ground:#F2F3F1;--paper:#FFFFFF;--sand:#E4E7E3;--line:#DCDFDB;--ink:#1D211F;--muted:#6B716D;
  --brown:#3C4440;--brown-deep:#1D211F;--wood:#9AA19C;--ok:#1E7A52;--ok-deep:#165F3F;--ok-soft:#E3F1E9;--bad:#C0392B;--radius:16px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;word-break:keep-all;color-scheme:light}
button,input{font:inherit;color:inherit}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,opacity .15s}
.btn:hover{background:#fff}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.primary:hover{background:var(--ok-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.small{height:38px;padding:0 14px;font-size:14px}
.link{background:none;border:0;padding:4px;color:var(--brown);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px}
.link.danger{color:var(--bad)}
.link:disabled{opacity:.4;cursor:not-allowed}

/* 머리 · 탭 */
.top{display:flex;align-items:center;gap:14px;max-width:1120px;margin:0 auto;padding:20px 16px 4px}
#headLogo{height:44px;width:auto;max-width:150px;object-fit:contain}
.top h1{font-size:18px;margin:0;color:var(--brown-deep);line-height:1.3}
.top p{margin:0;font-size:13px;color:var(--muted)}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--sand);padding:4px;border-radius:12px}
.tabs button{padding:9px 18px;border:0;background:none;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 공통 틀 */
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 32px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px 20px;align-items:start}
.side{position:sticky;top:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:15px;margin:0 0 14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.card h2 .link,.card h2 small{font-weight:400}
.card h2 small{color:var(--muted)}

/* 브랜드 */
.brandbar{max-width:1120px;margin:0 auto;padding:12px 16px 0}
.brand{display:grid;gap:14px}
.brand-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-head h2{margin:0 6px 0 0}
.brand-list{display:flex;gap:6px;flex-wrap:wrap}
.bchip{height:34px;padding:0 16px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.bchip:hover{color:var(--ink)}
.bchip[aria-pressed=true]{background:var(--brown-deep);border-color:var(--brown-deep);color:#fff}
.saved{margin-left:auto;font-size:12px;color:var(--muted)}
.saved.ok{color:var(--ok)}
.saved.bad{color:var(--bad)}
.brand-edit{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-box{position:relative;display:grid;place-items:center;width:150px;height:92px;border:2px dashed var(--wood);border-radius:12px;cursor:pointer;overflow:hidden;flex:none;
  background:repeating-conic-gradient(#E9ECEA 0% 25%,#FFFFFF 0% 50%) 50%/16px 16px;transition:border-color .15s}
.logo-box:hover,.logo-box.over{border-color:var(--brown)}
.logo-box:focus-within{outline:2px solid var(--wood);outline-offset:2px}
.logo-box input{position:absolute;width:1px;height:1px;opacity:0}
.logo-box img{max-width:100%;max-height:100%;padding:10px;object-fit:contain;display:block}
.logo-box span{font-size:13px;font-weight:700;color:var(--brown-deep);background:rgba(255,253,248,.85);padding:4px 10px;border-radius:8px}
.brand-name{display:grid;gap:6px;width:220px}
.brand-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.check input{width:18px;height:18px;accent-color:var(--brown-deep);margin:0}
.brand-tip{flex-basis:100%;margin:-4px 0 0;font-size:12px;color:var(--muted)}

/* 사진 넣는 칸 */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:128px;border:2px dashed var(--wood);border-radius:14px;background:#F7F8F7;cursor:pointer;text-align:center;padding:16px;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--sand);border-color:var(--brown)}
.drop:focus-within{outline:2px solid var(--wood);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop strong{display:block;font-size:16px;color:var(--brown-deep)}
.drop span{font-size:13px;color:var(--muted)}

/* 입력 공통 */
.row{display:grid;gap:8px}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.lab output,.lab small{font-weight:400;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.field{display:block;width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:15px}
.field:focus{outline:2px solid var(--wood);outline-offset:0;border-color:var(--wood)}
.field::placeholder{color:#B5AA9D}
input[type=range]{width:100%;accent-color:var(--brown-deep);height:28px;margin:0;cursor:pointer}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px;gap:3px;flex:1;min-width:0}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg input:checked+span{background:var(--ok);color:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--wood)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.inline{display:flex;gap:8px;align-items:center}
.swatch{flex:none;width:46px;height:46px;padding:5px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.swatch::-webkit-color-swatch-wrapper{padding:0}
.swatch::-webkit-color-swatch{border:1px solid rgba(0,0,0,.12);border-radius:7px}

/* ── 로고 넣기 ── */
#tool-logo .a{grid-column:1;grid-row:1}
#tool-logo .s{grid-column:1;grid-row:2}
#tool-logo .side{grid-column:2;grid-row:1/span 2}
.files-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px;font-size:13px;color:var(--muted)}
.thumbs{list-style:none;margin:0;padding:2px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:236px;overflow:auto}
.thumbs li{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sand);outline:3px solid transparent;outline-offset:-3px}
.thumbs li.on{outline-color:var(--ok)}
.thumbs .pick{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs li.bad img{visibility:hidden}
.thumbs li.bad .pick::after{content:'열 수 없음';position:absolute;inset:0;display:grid;place-items:center;background:rgba(179,38,30,.75);color:#fff;font-size:11px;font-weight:700}
.thumbs .del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(44,41,37,.72);color:#fff;font-size:15px;line-height:22px;padding:0;cursor:pointer}
.set{display:grid;gap:18px}
.posrow{display:flex;align-items:center;gap:14px}
.posbox{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:132px;height:100px;padding:6px;background:var(--sand);border-radius:12px;flex:none}
.posbox label{position:relative;display:block}
.posbox input{position:absolute;opacity:0;width:1px;height:1px}
.posbox span{display:block;width:100%;height:100%;border-radius:5px;background:#fff;opacity:.6;cursor:pointer;transition:opacity .15s,background .15s}
.posbox span:hover{opacity:1}
.posbox input:checked+span{opacity:1;background:var(--ok)}
.posbox input:focus-visible+span{outline:2px solid var(--wood)}
#posName{font-size:14px;color:var(--muted)}
.preview{display:grid;place-items:center;min-height:340px;background:var(--sand);border-radius:12px;overflow:hidden;padding:12px}
.preview canvas{display:block;max-width:100%;max-height:min(66vh,720px);width:auto;height:auto;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.preview .empty{color:var(--muted);font-size:14px;text-align:center;margin:0}
.meta{display:flex;justify-content:space-between;gap:12px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span:last-child{flex:none}
#tool-logo .x{display:grid;gap:10px;margin-top:14px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--sand);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.result{background:var(--ok-soft);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.result p{margin:0;font-size:14px;color:var(--ok);font-weight:700}
.result p small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.result .btns{display:flex;gap:8px}
.result .btn{flex:1;height:44px;font-size:14px}
.busy #tool-logo .a,.busy #tool-logo .s,.busy .brandbar{pointer-events:none;opacity:.6}

/* ── 블로그 썸네일 ── */
#tool-thumb .card + .card{margin-top:16px}
#tool-thumb .drop{flex-direction:row;justify-content:flex-start;text-align:left;gap:14px;min-height:96px;padding:12px 16px}
#tool-thumb .drop strong{font-size:15px}
.drop .ph{width:68px;height:68px;border-radius:10px;background:var(--sand);flex:none;object-fit:cover;display:block}
.form{display:grid;gap:16px}
#thumbInfo{gap:10px}
/* 썸네일 입력: 이름을 칸 왼쪽에 두어 세로 공간 절약 */
.irow,.tagrow{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:10px}
.tagrow{grid-template-columns:72px minmax(0,1fr) 34px;margin-top:10px}
.tagrow:first-child{margin-top:0}
#tagRows:empty{display:none}
.irow .field,.tagrow .field{height:42px}
.irow .swatch{width:42px;height:42px}
.tagdel{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.tagdel:hover{background:var(--sand);color:var(--bad)}
.addtag{justify-self:start;margin:-2px 0 0 78px;font-weight:700;text-decoration:none;color:var(--ok)}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ok)}
.swatches .swatch{width:40px;height:40px;border-radius:50%;padding:3px}
.swatches .swatch::-webkit-color-swatch{border-radius:50%}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.fontpick label{position:relative}
.fontpick input{position:absolute;opacity:0;width:1px;height:1px}
.fontpick span{display:flex;align-items:center;justify-content:center;height:42px;padding:0 6px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden}
.fontpick span:hover{border-color:var(--wood)}
.fontpick input:checked+span{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok);background:var(--ok-soft)}
.fontpick input:focus-visible+span{outline:2px solid var(--wood)}
.stage{position:relative;background:var(--sand);border-radius:12px;padding:14px;display:grid;place-items:center;overflow:hidden}
#cv{display:block;width:auto;height:auto;max-width:100%;max-height:min(72vh,640px);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);touch-action:none}
#cv.can-drag{cursor:grab}
#cv.dragging{cursor:grabbing}
#cv.paint{cursor:crosshair}
.brush-cursor{position:absolute;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.saved-inline{font-size:13px;color:var(--ok)}
.saved-inline.bad{color:var(--bad)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.hint{margin:10px 2px 0;font-size:13px;color:var(--muted);text-align:center}
#tool-thumb .x{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.toast{grid-column:1/-1;margin:0;font-size:13px;color:var(--ok);text-align:center;min-height:20px}

.foot{text-align:center;font-size:13px;color:var(--muted);padding:8px 16px 28px}

/* 창을 좁게 줄였을 때 한 줄로 */
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  #tool-logo .a,#tool-logo .s,#tool-logo .side{grid-column:1;grid-row:auto}
  .side{position:static}
}
</style>
</head>
<body>

<header class=&quot;top&quot;>
  <img id=&quot;headLogo&quot; alt=&quot;&quot; hidden>
  <div>
    <h1 id=&quot;pageTitle&quot;>로고 편집기</h1>
    <p id=&quot;pageDesc&quot;></p>
  </div>
  <nav class=&quot;tabs&quot; role=&quot;tablist&quot;>
    <button type=&quot;button&quot; role=&quot;tab&quot; data-tab=&quot;logo&quot; aria-selected=&quot;true&quot;>로고 넣기</button>
    <button type=&quot;button&quot; role=&quot;tab&quot; data-tab=&quot;thumb&quot; aria-selected=&quot;false&quot;>블로그 썸네일</button>
  </nav>
</header>

<!-- ======================= 브랜드 (로고 + 설정 묶음) ======================= -->
<div class=&quot;brandbar&quot;>
  <section class=&quot;card brand&quot;>
    <div class=&quot;brand-head&quot;>
      <h2>브랜드</h2>
      <div class=&quot;brand-list&quot; id=&quot;brandList&quot;></div>
      <button type=&quot;button&quot; class=&quot;link&quot; id=&quot;brandAdd&quot;>+ 브랜드 추가</button>
      <span class=&quot;saved&quot; id=&quot;savedNote&quot;></span>
    </div>
    <div class=&quot;brand-edit&quot;>
      <label class=&quot;logo-box&quot; id=&quot;logoBox&quot; title=&quot;눌러서 고르거나, 로고 파일을 여기로 끌어다 놓으세요&quot;>
        <input type=&quot;file&quot; id=&quot;logoInput&quot; accept=&quot;image/*&quot;>
        <img id=&quot;brandLogo&quot; alt=&quot;&quot; hidden>
        <span id=&quot;logoEmpty&quot;>로고 첨부</span>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>
<script>
/* ======================= 공통 ======================= */
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hasFiles = e => e.dataTransfer &amp;&amp; Array.from(e.dataTransfer.types).includes('Files');
const safeName = s => String(s || '').replace(/[\\/:*?&quot;<>|]/g, '').trim();

function loadImg(src){
  return new Promise((res, rej) => {
    const i = new Image();
    i.decoding = 'async';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('load'));
    i.src = src;
  });
}
const fileToDataURL = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(f);
});
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ---------- 저장소: 브라우저 안 IndexedDB (안 되면 localStorage) ---------- */
const KV = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('logo-tools', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => res(q.result);
    t.onerror = t.onabort = () => rej(t.error);
  }));
  return {
    async get(k){
      try{ const v = await run('readonly', s => s.get(k)); if (v !== undefined) return v; }catch(e){}
      try{ const v = localStorage.getItem('kv:' + k); return v ? JSON.parse(v) : undefined; }catch(e){ return undefined; }
    },
    async set(k, v){
      try{ await run('readwrite', s => s.put(v, k)); return true; }
      catch(e){ try{ localStorage.setItem('kv:' + k, JSON.stringify(v)); return true; }catch(e2){ return false; } }
    }
  };
})();

/* ---------- 기본값 ---------- */
const LOGO_DEFAULTS = {pos:'br', size:28, margin:2, opacity:100, tint:'orig', tintColor:'#6F5240', shadow:'off', output:'square', format:'png'};
// cardH: 카드 높이(0 = 글에 맞춤 ~ 100 = 사진 끝까지) · shape: 썸네일 비율 · tags: 매트·컬러 말고 더 넣은 태그 · note: 태그 밑 한 줄 문구
// (tags는 바꿀 때 항상 새 배열로 — 기본값 배열을 같이 쓰므로)
const THUMB_DEFAULTS = {tpl:'card', textPos:'top', cardH:0, shape:'square', tags:[], note:'', cardColor:'#FFFDF8', cardAlpha:82, frameColor:'#F7F3EC', frameAlpha:80,
  titleFont:'notoserif', bodyFont:'pretendard', mat:'', color:'', dot:'#F6F3EE', brush:90, blurAmt:60};

/* ---------- 브랜드: 로고 + 로고 설정 + 썸네일 설정을 브랜드마다 저장 ---------- */
const Brand = (() => {
  const KEY = 'brands-v1';
  let state = null;   // {profiles:[{id, name, logoSrc, builtin, removeWhite, opt, thumb}], current}
  let logo = null;    // 지금 브랜드 로고 (흰 배경 지우고 빈 여백 자른 것)
  let logoURL = '';
  const chains = new Map();
  const subs = [];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const make = (name, extra = {}) => ({id: uid(), name, logoSrc: null, builtin: false, removeWhite: false,
    opt: {...LOGO_DEFAULTS}, thumb: {...THUMB_DEFAULTS}, ...extra});

  function seed(){
    const g = make('지매트', {builtin: true});
    g.thumb.mat = 'G-80 매트 (80×80)';
    g.thumb.color = '모던 화이트';
    // 예전(지매트 전용) 버전에서 쓰던 설정이 있으면 옮겨옴
    try{
      const o = JSON.parse(store.get('gmat-logo-opt-v2') || 'null');
      if (o){
        for (const k of ['pos','size','margin','opacity','shadow','output','format']) if (k in o) g.opt[k] = o[k];
        if (o.color === 'white') g.opt.tint = 'white';
        else if (o.color === 'brown'){ g.opt.tint = 'custom'; g.opt.tintColor = '#6F5240'; }
      }
      const t = JSON.parse(store.get('gmat-thumb-opt') || 'null');
      if (t &amp;&amp; t.tpl) g.thumb.tpl = t.tpl;
    }catch(e){}
    return {profiles: [g, make('토리매트'), make('우아매트')], current: g.id};
  }
  async function init(){
    let s = await KV.get(KEY);
    if (!s || !Array.isArray(s.profiles) || !s.profiles.length) s = seed();
    for (const p of s.profiles){
      p.opt = {...LOGO_DEFAULTS, ...p.opt};
      p.thumb = {...THUMB_DEFAULTS, ...p.thumb};
    }
    if (!s.profiles.some(p => p.id === s.current)) s.current = s.profiles[0].id;
    state = s;
    await loadLogo();
    render(); emit();
  }
  const cur = () => state ? state.profiles.find(p => p.id === state.current) : null;
  const srcOf = p => p.logoSrc || (p.builtin ? LOGO_SRC : null);
  const emit = () => subs.forEach(fn => fn());

  /* 로고 손질: 흰 배경 지우기 → 빈 여백 자르기 */
  function clearWhiteBg(d, w, h){
    // 가장자리에서 이어진 흰 부분만 지움 (로고 안쪽 흰 글씨는 그대로)
    const near = p => {
      const i = p * 4;
      if (d[i+3] < 16) return true;
      const mn = Math.min(d[i], d[i+1], d[i+2]), mx = Math.max(d[i], d[i+1], d[i+2]);
      return mn >= 200 &amp;&amp; mx - mn <= 36;
    };
    const seen = new Uint8Array(w * h), stack = [];
    const push = p => { if (!seen[p] &amp;&amp; near(p)){ seen[p] = 1; stack.push(p); } };
    for (let x = 0; x < w; x++){ push(x); push((h - 1) * w + x); }
    for (let y = 0; y < h; y++){ push(y * w); push(y * w + w - 1); }
    while (stack.length){
      const p = stack.pop(), i = p * 4;
      const t = Math.min(1, Math.max(0, (Math.min(d[i], d[i+1], d[i+2]) - 200) / 45)); // 245 이상이면 완전히 투명
      if (t >= 1) d[i+3] = 0;
      else if (t > 0){
        // 흰색이 섞인 테두리 픽셀은 흰색을 빼서 하얀 테 없이
        for (let k = 0; k < 3; k++) d[i+k] = Math.max(0, Math.min(255, Math.round((d[i+k] - 255 * t) / (1 - t))));
        d[i+3] = Math.round(d[i+3] * (1 - t));
      }
      const x = p % w;
      if (x > 0) push(p - 1);
      if (x < w - 1) push(p + 1);
      if (p >= w) push(p - w);
      if (p < w * (h - 1)) push(p + w);
    }
  }
  function prepLogo(img, removeWhite){
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently: true});
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, w, h);
    const id = x.getImageData(0, 0, w, h), d = id.data;
    if (removeWhite) clearWhiteBg(d, w, h);
    // 누끼 딴 로고에 눈에 안 보이게 남은 옅은 픽셀 정리
    // (남겨두면 흰색으로 바꾸거나 그림자를 넣을 때 로고 뒤에 네모난 배경처럼 보임)
    for (let i = 3; i < d.length; i += 4) if (d[i] < 24) d[i] = 0;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++){
      if (d[(yy * w + xx) * 4 + 3] > 0){
        if (xx < x0) x0 = xx; if (xx > x1) x1 = xx;
        if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
      }
    }
    if (x1 < 0) return null;
    x.putImageData(id, 0, 0);
    const out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }
  function whiteCorners(img){
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const x = c.getContext('2d', {willReadFrequently: true});
    x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    return [0, 31, 32 * 31, 32 * 32 - 1].every(p => d[p*4+3] > 240 &amp;&amp; Math.min(d[p*4], d[p*4+1], d[p*4+2]) > 235);
  }
  async function loadLogo(){
    chains.clear(); logo = null; logoURL = '';
    const p = cur(), src = srcOf(p);
    if (!src) return;
    try{
      logo = prepLogo(await loadImg(src), p.removeWhite);
      if (logo) logoURL = logo.toDataURL('image/png');
    }catch(e){ logo = null; }
  }

  /* 색깔별 로고 (원본 → 절반 → 절반 … 작게 찍어도 계단현상 없게) */
  function chain(tint, color){
    const key = tint === 'custom' ? 'c' + color : tint;
    if (chains.has(key)) return chains.get(key);
    let c = document.createElement('canvas');
    c.width = logo.width; c.height = logo.height;
    const x = c.getContext('2d');
    x.drawImage(logo, 0, 0);
    const fill = tint === 'white' ? '#FFFFFF' : tint === 'custom' ? color : null;
    if (fill){ x.globalCompositeOperation = 'source-in'; x.fillStyle = fill; x.fillRect(0, 0, c.width, c.height); }
    const list = [c];
    while (c.width > 160){
      const n = document.createElement('canvas');
      n.width = Math.round(c.width / 2); n.height = Math.max(1, Math.round(c.height / 2));
      const nx = n.getContext('2d');
      nx.imageSmoothingQuality = 'high';
      nx.drawImage(c, 0, 0, n.width, n.height);
      list.push(n); c = n;
    }
    chains.set(key, list);
    return list;
  }
  function logoFor(tint, w, color){
    if (!logo) return null;
    const list = chain(tint, color);
    let pick = list[0];
    for (const c of list) if (c.width >= w) pick = c;
    return pick;
  }

  /* 화면 */
  let noteT = 0;
  function note(msg, cls){
    const n = $('#savedNote');
    n.textContent = msg; n.className = 'saved ' + (cls || '');
    clearTimeout(noteT);
    if (cls === 'ok') noteT = setTimeout(() => { n.textContent = ''; n.className = 'saved'; }, 2500);
  }
  let saveT = 0;
  function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
  function saveNow(){ clearTimeout(saveT); return save(); }
  async function save(){
    const ok = await KV.set(KEY, state);
    note(ok ? '✓ 저장됨' : '⚠ 저장하지 못했어요 (브라우저 저장 공간 부족)', ok ? 'ok' : 'bad');
    // 각 설정 칸 아래에도 어느 브랜드에 저장됐는지 표시
    const p = cur();
    document.querySelectorAll('[data-saved]').forEach(el => {
      el.textContent = ok ? `✓ '${p.name}'에 저장됨` : '⚠ 저장하지 못했어요';
      el.classList.toggle('bad', !ok);
    });
    return ok;
  }
  function render(){
    const p = cur();
    const list = $('#brandList');
    list.textContent = '';
    for (const q of state.profiles){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'bchip';
      b.textContent = q.name || '이름 없음';
      b.setAttribute('aria-pressed', q.id === p.id);
      b.onclick = () => { if (q.id !== state.current) select(q.id); };
      list.appendChild(b);
    }
    if (document.activeElement !== $('#brandName')) $('#brandName').value = p.name;
    const has = !!srcOf(p);
    $('#brandLogo').hidden = !logoURL;
    if (logoURL) $('#brandLogo').src = logoURL;
    $('#logoEmpty').hidden = !!logoURL;
    $('#logoEmpty').textContent = has &amp;&amp; !logo ? '로고를 읽지 못했어요' : '로고 첨부';
    $('#logoPick').textContent = has ? '로고 바꾸기' : '로고 첨부';
    $('#removeWhite').checked = p.removeWhite;
    $('#removeWhiteWrap').hidden = !has;
    $('#builtinReset').hidden = !(p.builtin &amp;&amp; p.logoSrc);
    $('#brandDelete').disabled = state.profiles.length < 2;
    const hl = $('#headLogo');
    hl.hidden = !logoURL;
    if (logoURL) hl.src = logoURL;
  }
  async function select(id){
    state.current = id;
    document.querySelectorAll('[data-saved]').forEach(el => { el.textContent = ''; });
    await loadLogo();
    render(); emit(); saveSoon();
  }
  async function refreshLogo(){ await loadLogo(); render(); emit(); saveSoon(); }

  async function setLogoFile(file){
    if (!file || !state) return;
    if (!(file.type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(file.name))) return;
    let src, img;
    try{ src = await fileToDataURL(file); img = await loadImg(src); }
    catch(e){ alert('이 이미지는 열 수 없어요. PNG나 JPG로 넣어주세요.'); return; }
    if (!img.naturalWidth){ alert('이 이미지는 크기를 알 수 없어요. PNG나 JPG로 넣어주세요.'); return; }
    // 너무 큰 로고는 줄여서 저장 (브라우저 저장 공간 아끼기)
    const big = Math.max(img.naturalWidth, img.naturalHeight);
    if (big > 1600 || file.size > 1.5e6){
      const k = Math.min(1, 1600 / big), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, c.width, c.height);
      src = c.toDataURL('image/png');
    }
    const p = cur();
    p.logoSrc = src;
    p.removeWhite = whiteCorners(img); // 네 귀퉁이가 하얀 로고면 흰 배경 지우기를 켜 둠
    await refreshLogo();
  }

  $('#logoInput').addEventListener('change', e => { setLogoFile(e.target.files[0]); e.target.value = ''; });
  $('#logoPick').addEventListener('click', () => $('#logoInput').click());
  $('#removeWhite').addEventListener('change', e => { cur().removeWhite = e.target.checked; refreshLogo(); });
  $('#builtinReset').addEventListener('click', () => { const p = cur(); p.logoSrc = null; p.removeWhite = false; refreshLogo(); });
  $('#brandName').addEventListener('input', e => { cur().name = e.target.value; render(); saveSoon(); });
  $('#brandName').addEventListener('blur', e => {
    if (!cur().name.trim()){ cur().name = '이름 없음'; e.target.value = cur().name; render(); saveSoon(); }
  });
  $('#brandAdd').addEventListener('click', async () => {
    const p = make('새 브랜드');
    state.profiles.push(p);
    await select(p.id);
    const n = $('#brandName'); n.focus(); n.select();
  });
  $('#brandDelete').addEventListener('click', async () => {
    const p = cur();
    if (state.profiles.length < 2) return;
    if (!confirm(`'${p.name}' 브랜드를 삭제할까요?\n저장해 둔 로고와 설정도 함께 지워져요.`)) return;
    state.profiles = state.profiles.filter(q => q.id !== p.id);
    await select(state.profiles[0].id);
  });

  return {
    init, cur, saveSoon, saveNow, setLogoFile, logoFor,
    on: fn => subs.push(fn),
    hasLogo: () => !!logo,
    ratio: () => logo ? logo.height / logo.width : .75,
    name: () => cur() ? cur().name : '',
    box: $('#logoBox')
  };
})();
</script>

<script>
/* ======================= 로고 넣기 ======================= */
const LogoTool = (() => {
  const POS_NAMES = {tl:'왼쪽 위',tc:'가운데 위',tr:'오른쪽 위',ml:'왼쪽 가운데',mc:'정가운데',mr:'오른쪽 가운데',bl:'왼쪽 아래',bc:'가운데 아래',br:'오른쪽 아래'};
  const JPG_QUALITY = 0.92;
  const MAX_PX = 50e6; // 원본 크기로 저장할 때 5천만 화소 넘는 사진만 줄임 (크롬 메모리 보호)

  let opt = null;      // 지금 브랜드의 로고 설정 (바꾸면 브랜드에 그대로 저장됨)
  let items = [];      // {id, file, url, bad}
  let seq = 0, current = -1;
  let prevImg = null, raf = 0;
  let results = null;  // {out:[{name, blob}], failed}
  let busy = false;
  const form = $('#settings');

  /* ---------- 그리기 ---------- */
  function outSize(img){
    let W = img.naturalWidth, H = img.naturalHeight;
    if (opt.output === 'square') W = H = 1080;
    if (opt.output === 'story'){ W = 1080; H = 1920; }
    const k = Math.min(1, Math.sqrt(MAX_PX / (W * H)));
    return [Math.round(W * k), Math.round(H * k)];
  }
  function render(img, cv, limit){
    // 1080×1080 · 9:16(1080×1920)은 잘라내지 않고 사진 전체를 그 비율로 맞춤(늘리기)
    let [W, H] = outSize(img);
    if (limit &amp;&amp; Math.max(W, H) > limit){ const k = limit / Math.max(W, H); W = Math.round(W * k); H = Math.round(H * k); }
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (opt.format === 'jpg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); } // 투명 PNG를 JPG로 저장할 때 검게 안 나오게
    ctx.drawImage(img, 0, 0, W, H);

    // 크기 = 로고의 긴 쪽 길이가 사진 짧은 변의 몇 %인지
    const base = Math.min(W, H), r = Brand.ratio(), L = base * opt.size / 100;
    const lw = r <= 1 ? L : L / r, lh = r <= 1 ? L * r : L;
    const m = base * opt.margin / 100;
    const row = opt.pos[0], col = opt.pos[1];
    const x = col === 'l' ? m : col === 'r' ? W - lw - m : (W - lw) / 2;
    const y = row === 't' ? m : row === 'b' ? H - lh - m : (H - lh) / 2;
    const logo = Brand.logoFor('orig', lw);   // 로고는 첨부한 로고 색 그대로
    if (!logo) return cv;
    ctx.save();
    ctx.globalAlpha = opt.opacity / 100;
    if (opt.shadow === 'on'){
      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = Math.max(lw, lh) * 0.03;
      ctx.shadowOffsetY = Math.max(lw, lh) * 0.008;
    }
    ctx.drawImage(logo, x, y, lw, lh);
    ctx.restore();
    return cv;
  }
  function drawPreview(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const cv = $('#preview');
      const has = !!opt &amp;&amp; !!prevImg &amp;&amp; Brand.hasLogo();
      cv.hidden = !has; $('#emptyMsg').hidden = has; $('#meta').hidden = !has;
      $('#emptyMsg').textContent = !opt ? '' : !Brand.hasLogo()
        ? `'${Brand.name()}' 로고를 먼저 첨부해 주세요 (위쪽 브랜드 칸)`
        : '사진을 넣으면 여기서 미리 볼 수 있어요';
      if (!has) return;
      render(prevImg, cv, 1600);
      const [W, H] = outSize(prevImg);
      $('#metaName').textContent = items[current] ? items[current].file.name : '';
      $('#metaSize').textContent = `저장 크기 ${W}×${H}`;
    });
  }

  /* ---------- 사진 목록 ---------- */
  function addFiles(list){
    if (busy) return;
    const add = [...list].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(f.name));
    if (!add.length) return;
    const first = items.length;
    for (const f of add) items.push({id: ++seq, file: f, url: URL.createObjectURL(f), bad: false});
    invalidate();
    renderThumbs();
    select(first);
  }
  function removeItem(id){
    const i = items.findIndex(it => it.id === id);
    if (i < 0 || busy) return;
    URL.revokeObjectURL(items[i].url);
    items.splice(i, 1);
    invalidate();
    renderThumbs();
    if (i === current || current >= items.length) select(Math.min(i, items.length - 1));
    else { if (i < current) current--; markThumbs(); }
  }
  function clearAll(){
    if (busy) return;
    items.forEach(it => URL.revokeObjectURL(it.url));
    items = [];
    invalidate();
    renderThumbs();
    select(-1);
  }
  function renderThumbs(){
    const ul = $('#thumbs');
    ul.textContent = '';
    for (const it of items){
      const li = document.createElement('li');
      li.dataset.id = it.id;
      if (it.bad) li.classList.add('bad');
      li.innerHTML = '<button type=&quot;button&quot; class=&quot;pick&quot;><img alt=&quot;&quot; loading=&quot;lazy&quot;></button><button type=&quot;button&quot; class=&quot;del&quot; aria-label=&quot;빼기&quot;>×</button>';
      li.querySelector('img').src = it.url;
      li.querySelector('.pick').setAttribute('aria-label', it.file.name);
      li.querySelector('img').onerror = () => { it.bad = true; li.classList.add('bad'); };
      ul.appendChild(li);
    }
    $('#filesHead').hidden = !items.length;
    $('#count').textContent = `사진 ${items.length}장`;
    updateSaveBtn();
    markThumbs();
  }
  function markThumbs(){
    document.querySelectorAll('#thumbs li').forEach((li, i) => li.classList.toggle('on', i === current));
  }
  async function select(i){
    current = i;
    markThumbs();
    const it = items[i];
    if (!it){ prevImg = null; drawPreview(); return; }
    try{
      const img = await loadImg(it.url);
      if (items[current] !== it) return;
      prevImg = img;
    }catch(e){
      it.bad = true;
      prevImg = null;
      const li = document.querySelector(`#thumbs li[data-id=&quot;${it.id}&quot;]`);
      if (li) li.classList.add('bad');
    }
    drawPreview();
  }
  $('#thumbs').addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = +li.dataset.id;
    if (e.target.closest('.del')) removeItem(id);
    else select(items.findIndex(it => it.id === id));
  });
  $('#clearBtn').addEventListener('click', clearAll);
  $('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

  /* ---------- 설정 ---------- */
  function buildPosBox(){
    const box = $('#posBox');
    for (const r of 'tmb') for (const c of 'lcr'){
      const v = r + c;
      box.insertAdjacentHTML('beforeend', `<label title=&quot;${POS_NAMES[v]}&quot;><input type=&quot;radio&quot; name=&quot;pos&quot; value=&quot;${v}&quot; aria-label=&quot;${POS_NAMES[v]}&quot;><span></span></label>`);
    }
  }
  function applyOpt(){
    for (const k of Object.keys(LOGO_DEFAULTS)){
      const el = form.elements[k];
      if (el) el.value = opt[k];
    }
    showOpt();
  }
  function showOpt(){
    $('#sizeOut').textContent = opt.size + '%';
    $('#marginOut').textContent = opt.margin + '%';
    $('#opacityOut').textContent = opt.opacity + '%';
    $('#posName').textContent = POS_NAMES[opt.pos];
    $('#fmtHint').textContent = opt.format === 'png' ? '20MB 넘으면 자동으로 줄여요' : '용량 작음';
  }
  function onOpt(e){
    const t = e.target;
    if (!opt || !t.name || !(t.name in LOGO_DEFAULTS)) return;
    if (busy){ applyOpt(); return; } // 저장 중에는 설정 고정
    const v = t.type === 'range' ? +t.value : t.value;
    opt[t.name] = v;
    Brand.saveSoon();
    showOpt();
    invalidate();
    drawPreview();
  }
  form.addEventListener('input', onOpt);
  form.addEventListener('change', onOpt);
  $('#resetBtn').addEventListener('click', () => {
    if (!opt) return;
    Object.assign(opt, LOGO_DEFAULTS);
    Brand.saveSoon();
    applyOpt(); invalidate(); drawPreview();
  });

  /* ---------- 저장 ---------- */
  function invalidate(){ results = null; $('#result').hidden = true; }
  function setBusy(b){
    busy = b;
    document.body.classList.toggle('busy', b);
    $('#progress').hidden = !b;
    updateSaveBtn();
  }
  function updateSaveBtn(){
    const btn = $('#saveBtn');
    btn.disabled = busy || !items.length || !Brand.hasLogo();
    btn.textContent = busy ? '로고 넣는 중…' : items.length ? `로고 넣고 저장 (${items.length}장)` : '로고 넣고 저장';
  }
  function progress(done, total){
    $('#barFill').style.width = (done / total * 100) + '%';
    $('#progText').textContent = `${done} / ${total}`;
  }
  function outName(file, used){
    const base = file.name.replace(/\.[^.]+$/, '') || 'image';
    const tag = safeName(Brand.name()) || 'logo';
    const ext = opt.format === 'png' ? 'png' : 'jpg';
    let name = `${base}_${tag}.${ext}`, n = 2;
    while (used.has(name)) name = `${base}_${tag}_${n++}.${ext}`;
    used.add(name);
    return name;
  }
  // PNG는 블로그 사진 한 장 제한(20MB)을 넘으면 크기를 줄여 다시 저장 (여유 있게 19MB 이하로)
  const PNG_MAX = 19e6;
  const encode = cv => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), opt.format === 'png' ? 'image/png' : 'image/jpeg', JPG_QUALITY));
  async function processAll(){
    setBusy(true);
    const out = [], used = new Set();
    let failed = 0, shrunk = 0;
    const cv = document.createElement('canvas');
    for (let i = 0; i < items.length; i++){
      progress(i, items.length);
      await sleep(0); // 진행률 화면에 반영
      try{
        const img = await loadImg(items[i].url);
        render(img, cv);
        let blob = await encode(cv);
        if (opt.format === 'png' &amp;&amp; blob.size > PNG_MAX){
          let side = Math.max(cv.width, cv.height);
          for (let t = 0; t < 6 &amp;&amp; blob.size > PNG_MAX; t++){
            side = Math.floor(side * Math.sqrt(PNG_MAX / blob.size) * 0.95);
            render(img, cv, side);
            blob = await encode(cv);
          }
          shrunk++;
        }
        out.push({name: outName(items[i].file, used), blob});
      }catch(e){
        failed++;
        items[i].bad = true;
      }
      cv.width = cv.height = 0; // 메모리 바로 반납
    }
    progress(items.length, items.length);
    setBusy(false);
    if (failed) renderThumbs();
    return {out, failed, shrunk};
  }
  function stamp(){
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}`;
  }
  async function downloadResults(){
    const list = results.out;
    if (list.length === 1) return download(list[0].blob, list[0].name);
    if (window.JSZip){
      const zip = new JSZip();
      list.forEach(r => zip.file(r.name, r.blob));
      const blob = await zip.generateAsync({type:'blob', compression:'STORE'});
      download(blob, `${safeName(Brand.name()) || 'logo'}_로고_${stamp()}_${list.length}장.zip`);
    } else {
      // 압축 라이브러리를 못 불러왔을 때(인터넷 끊김 등)는 한 장씩
      for (const r of list){ download(r.blob, r.name); await sleep(400); }
    }
  }
  function showResult(){
    const {out, failed, shrunk} = results;
    $('#resultText').innerHTML = `✓ ${out.length}장 저장` +
      (shrunk ? `<small>${shrunk}장은 20MB가 넘어서 크기를 줄였어요</small>` : '') +
      (failed ? `<small>${failed}장은 열 수 없는 사진이라 뺐어요 (HEIC 등)</small>` : '');
    $('#downloadBtn').hidden = !out.length;
    $('#result').hidden = false;
  }
  $('#saveBtn').addEventListener('click', async () => {
    if (busy || !items.length || !Brand.hasLogo()) return;
    if (!results) results = await processAll();
    if (results.out.length) await downloadResults();
    showResult();
  });
  $('#downloadBtn').addEventListener('click', () => results &amp;&amp; downloadResults());
  $('#logoSave').addEventListener('click', () => Brand.saveNow());

  buildPosBox();
  // 브랜드를 바꾸거나 로고를 새로 넣으면 그 브랜드 설정으로 다시 그림
  Brand.on(() => { opt = Brand.cur().opt; applyOpt(); invalidate(); updateSaveBtn(); drawPreview(); });
  return {drop: $('#drop'), addFiles, redraw: drawPreview};
})();
</script>

<script>
/* ======================= 블로그 썸네일 ======================= */
const ThumbTool = (() => {
  // 썸네일 크기: 가로 1080 고정, 세로는 비율(정사각형 1080 / 9:16 1920 / 원본 사진 비율)
  let CW = 1080, CH = 1080;

  const TITLE_FONTS = {

    notosans:   {label:'노토 산스',  family:&quot;'Noto Sans KR'&quot;,        w:{n:500, b:600, x:700}},
    gothica1:   {label:'고딕 A1',    family:&quot;'Gothic A1'&quot;,           w:{n:500, b:600, x:700}},
    ibmplex:    {label:'IBM 플렉스', family:&quot;'IBM Plex Sans KR'&quot;,    w:{n:500, b:600, x:700}},
    nanumgothic:{label:'나눔고딕',   family:&quot;'Nanum Gothic'&quot;,        w:{n:400, b:700, x:800}},
    gowundd:    {label:'고운돋움',   family:&quot;'Gowun Dodum'&quot;,         w:{n:400, b:400, x:400}},
    sunflower:  {label:'해바라기',   family:&quot;'Sunflower'&quot;,           w:{n:500, b:700, x:700}}
  };
  const CARD_SWATCHES = [['#FFFDF8','화이트'], ['#F7F3EC','베이지'], ['#E6D5BF','샌드'], ['#DDE3D6','세이지'], ['#6F5240','브라운'], ['#2C2925','차콜']];
  const FRAME_SWATCHES = [['#F7F3EC','베이지'], ['#FFFFFF','화이트'], ['#E6D5BF','샌드'], ['#DDE3D6','세이지'], ['#6F5240','브라운'], ['#2C2925','차콜']];
  const MAX_TAGS = 6;

  let th = null;                                             // 지금 브랜드의 썸네일 설정 (바꾸면 브랜드에 저장됨)
  const st = {fx:.5, fy:.5, zoom:100, bright:100, tool:'move'}; // 사진 위치·크기·밝기는 사진마다 새로
  let orig = null;         // 넣은 사진 그대로 (긴 변 2800px 이하로 줄인 것)
  let photo = null;        // 썸네일 비율로 늘린 사진 (원본 비율이면 orig 그대로)
  let bgBlur = null;       // 사진을 칸보다 작게 줄였을 때 빈 곳을 채울 흐린 사진
  let over = {x:0, y:0};   // 사진이 칸보다 넘치는 양 (끌기 계산용, 작으면 음수)
  let xf = null;           // 마지막으로 그린 사진의 위치·배율 (블러 붓 좌표 계산용)
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const info = $('#thumbInfo'), design = $('#thumbDesign'), photoForm = $('#thumbPhoto');

  const TF = () => TITLE_FONTS[th.titleFont] || TITLE_FONTS.notoserif;
  const BF = () => BODY_FONTS[th.bodyFont] || BODY_FONTS.pretendard;
  const titleFont = s => `${TF().weight} ${Math.round(s)}px ${TF().family}, serif`;
  const bodyFont = (wk, s) => `${BF().w[wk]} ${Math.round(s)}px ${BF().family}, 'Malgun Gothic', sans-serif`;
  const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 &amp; 255, n >> 8 &amp; 255, n &amp; 255]; };
  const hexA = (hex, a) => `rgba(${rgb(hex).join(',')},${a})`;
  const isDark = hex => { const [r, g, b] = rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < .55; };
  // 바탕색이 어두우면 글씨·로고를 흰색으로
  const tone = hex => isDark(hex)
    ? {ink:'#FFFFFF', sub:'rgba(255,255,255,.88)', lab:'rgba(255,255,255,.72)', tint:'white',
       chip:{bg:'rgba(255,255,255,.14)', stroke:'rgba(255,255,255,.45)', fg:'#fff'}}
    : {ink:'#4A3628', sub:'#6F5240', lab:'#A0826A', tint:'orig',
       chip:{bg:'rgba(255,255,255,.72)', stroke:'rgba(111,82,64,.22)', fg:'#5A4232'}};

  /* ---------- 썸네일 비율: 사진을 늘려서 맞춤 ---------- */
  function shapeSize(){
    if (th &amp;&amp; th.shape === 'story') return [1080, 1920];
    if (th &amp;&amp; th.shape === 'orig' &amp;&amp; orig){
      // 사진 비율 그대로 (아주 길쭉한 사진만 16:9 ~ 9:16 안으로)
      const r = Math.min(16 / 9, Math.max(9 / 16, orig.height / orig.width));
      return [1080, Math.round(1080 * r)];
    }
    return [1080, 1080];
  }
  function applyShape(){
    const [w, h] = shapeSize();
    if (w !== CW || h !== CH){ CW = w; CH = h; cv.width = w; cv.height = h; }
    $('#cvSize').textContent = `${CW}×${CH}`;
    if (!orig) return;
    // 사진을 썸네일 비율로 늘림 (가로 해상도는 그대로, 세로만 늘리거나 줄임)
    let pw = orig.width, ph = Math.round(orig.width * CH / CW);
    if (ph > 2800){ pw = Math.round(pw * 2800 / ph); ph = 2800; }
    const same = Math.abs(ph / pw - orig.height / orig.width) < .002;
    const old = photo;
    if (same) photo = orig;
    else if (!photo || photo === orig || photo.width !== pw || photo.height !== ph){
      const c = document.createElement('canvas');
      c.width = pw; c.height = ph;
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(orig, 0, 0, pw, ph);
      photo = c;
    }
    if (photo === old) return;
    // 빈 곳 채울 흐린 사진 (작게 만들어 흐리게)
    const kb = 360 / Math.max(photo.width, photo.height), b = document.createElement('canvas');
    b.width = Math.max(1, Math.round(photo.width * kb)); b.height = Math.max(1, Math.round(photo.height * kb));
    const bx = b.getContext('2d');
    bx.drawImage(photo, 0, 0, b.width, b.height);
    bx.filter = 'blur(10px)';
    bx.drawImage(photo, 0, 0, b.width, b.height);
    bgBlur = b;
    // 칠해 둔 블러도 늘린 사진에 맞춰 옮김
    if (old &amp;&amp; strokes.length){
      const sx = photo.width / old.width, sy = photo.height / old.height;
      strokes = strokes.map(s => ({...s, r: s.r * Math.sqrt(sx * sy), pts: s.pts.map(([px, py]) => [px * sx, py * sy])}));
    }
    mask = null; blurred = null; blurredAmt = -1;
    if (strokes.length) rebuildMask();
  }

  /* ---------- 로고 ---------- */
  function fitLogo(maxW, maxH){
    const r = Brand.ratio();
    let w = maxW, h = w * r;
    if (h > maxH){ h = maxH; w = h / r; }
    return {w, h};
  }
  function drawLogo(tint, x, y, w, h, shadow){
    const L = Brand.logoFor(tint, w);
    if (!L) return;
    ctx.save();
    if (shadow){ ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 2; }
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(L, x, y, w, h);
    ctx.restore();
  }

  /* ---------- 글자 ---------- */
  function splitTwo(t){
    const sp = [...t.matchAll(/ /g)].map(m => m.index);
    if (!sp.length){ const h = Math.ceil(t.length / 2); return [t.slice(0, h), t.slice(h)]; }
    const mid = t.length / 2;
    const i = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
    return [t.slice(0, i), t.slice(i + 1)];
  }
  // 한 줄에 맞춰 글자 크기를 줄이고, 너무 작아지면 두 줄로
  function fitTitle(text, max, min, width){
    const sc = TF().scale || 1;
    max = Math.round(max * sc); min = Math.round(min * sc);
    const one = Math.round(max * .72);
    for (let s = max; s >= one; s -= 2){
      ctx.font = titleFont(s);
      if (ctx.measureText(text).width <= width) return {lines:[text], size:s};
    }
    const lines = splitTwo(text);
    for (let s = max; s >= min; s -= 2){
      ctx.font = titleFont(s);
      if (lines.every(l => ctx.measureText(l).width <= width)) return {lines, size:s};
    }
    return {lines, size:min};
  }
  // 줄 높이: 손글씨처럼 크게 키운 글꼴은 줄 간격을 덜 벌림
  const lineH = t => t.size * (TF().scale ? 1.05 : 1.24);
  function fitLine(text, wk, max, min, width){
    let s = max;
    for (; s > min; s -= 1){
      ctx.font = bodyFont(wk, s);
      if (ctx.measureText(text).width <= width) break;
    }
    return s;
  }
  function pillW(text, o){
    ctx.font = bodyFont('b', o.fs);
    return ctx.measureText(text).width + o.px * 2 + (o.dot ? o.fs * .62 + 10 : 0);
  }
  function pill(x, y, text, o){
    const w = pillW(text, o);
    ctx.beginPath(); ctx.roundRect(x, y, w, o.h, o.h / 2);
    if (o.bg){ ctx.fillStyle = o.bg; ctx.fill(); }
    if (o.stroke){ ctx.strokeStyle = o.stroke; ctx.lineWidth = 2; ctx.stroke(); }
    let tx = x + o.px;
    if (o.dot){
      const r = o.fs * .31;
      ctx.beginPath(); ctx.arc(tx + r, y + o.h / 2, r, 0, Math.PI * 2);
      ctx.fillStyle = o.dot; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2; ctx.stroke();
      tx += r * 2 + 10;
    }
    ctx.fillStyle = o.fg; ctx.textBaseline = 'middle';
    ctx.font = bodyFont('b', o.fs);
    ctx.fillText(text, tx, y + o.h / 2 + 1);
    return w;
  }
  // 태그: 매트 · 컬러 · 더 넣은 태그
  const chipItems = d => [d.mat &amp;&amp; {text:d.mat}, d.color &amp;&amp; {text:d.color, dot:d.dot}, ...d.tags.map(t => ({text:t}))].filter(Boolean);
  // 태그 배치: 넓으면 다음 줄로 (두 줄 안에 들어갈 때까지 글자를 줄이고, 그래도 넘치면 줄을 더 씀)
  const CHIP_GAP = 12, ROW_GAP = 10;
  function layoutChips(items, maxW, base){
    const pack = fs => {
      const rows = [[]];
      let w = 0;
      for (const it of items){
        const iw = Math.min(maxW, pillW(it.text, {...base, fs, dot:it.dot}));
        if (rows[rows.length - 1].length &amp;&amp; w + CHIP_GAP + iw > maxW){ rows.push([]); w = 0; }
        w += (rows[rows.length - 1].length ? CHIP_GAP : 0) + iw;
        rows[rows.length - 1].push(it);
      }
      return rows;
    };
    let fs = base.fs, rows = pack(fs);
    while (fs > 20 &amp;&amp; (rows.length > 2 || items.some(it => pillW(it.text, {...base, fs, dot:it.dot}) > maxW))){ fs--; rows = pack(fs); }
    return {rows, fs, height: rows.length * base.h + (rows.length - 1) * ROW_GAP};
  }
  function drawChips(cl, x, y, base){
    for (const row of cl.rows){
      let xx = x;
      for (const it of row) xx += pill(xx, y, it.text, {...base, fs:cl.fs, dot:it.dot}) + CHIP_GAP;
      y += base.h + ROW_GAP;
    }
  }
  function label(text, x, cy, size, color){
    ctx.save();
    ctx.fillStyle = color; ctx.textBaseline = 'middle';
    ctx.font = bodyFont('x', size);
    ctx.letterSpacing = Math.round(size * .22) + 'px';
    ctx.fillText(text, x, cy);
    ctx.restore();
  }
  // 반투명 판 밑 그림자: 판 바깥쪽에만 그려서 판이 비쳐도 탁해지지 않게
  function softShadow(x, y, w, h, r, alpha){
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, CW, CH); ctx.roundRect(x, y, w, h, r); ctx.clip('evenodd');
    ctx.shadowColor = `rgba(40,28,20,${alpha})`; ctx.shadowBlur = 44; ctx.shadowOffsetY = 12;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();
  }

  /* ---------- 부분 블러 ---------- */
  let strokes = [];        // 칠한 붓질 [{mode:'blur'|'erase', r, pts:[[x,y]…]}] (사진 좌표라 사진을 옮겨도 그 자리에 붙어 있음)
  let mask = null;         // 블러 칠한 곳
  let blurred = null, blurredAmt = -1;
  let fxCanvas = null, fxDirty = true;
  let stroke = null;

  function resetBlur(){
    strokes = []; stroke = null; mask = null; blurred = null; blurredAmt = -1; fxDirty = true;
    updateBlurBtns();
  }
  function maskCtx(){
    if (!mask){ mask = document.createElement('canvas'); mask.width = photo.width; mask.height = photo.height; }
    return mask.getContext('2d');
  }
  function dab(m, x, y, r){
    const g = m.createRadialGradient(x, y, r * .45, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    m.fillStyle = g;
    m.beginPath(); m.arc(x, y, r, 0, Math.PI * 2); m.fill();
  }
  function paint(s, a, b){
    const m = maskCtx();
    m.save();
    m.globalCompositeOperation = s.mode === 'erase' ? 'destination-out' : 'source-over';
    const dx = b[0] - a[0], dy = b[1] - a[1], dist = Math.hypot(dx, dy), step = Math.max(1, s.r * .25);
    if (!dist) dab(m, b[0], b[1], s.r);
    for (let t = step; t <= dist; t += step) dab(m, a[0] + dx * t / dist, a[1] + dy * t / dist, s.r);
    m.restore();
    fxDirty = true;
  }
  function rebuildMask(){
    if (mask) mask.getContext('2d').clearRect(0, 0, mask.width, mask.height);
    for (const s of strokes){
      paint(s, s.pts[0], s.pts[0]);
      for (let i = 1; i < s.pts.length; i++) paint(s, s.pts[i - 1], s.pts[i]);
    }
    fxDirty = true;
  }
  // 블러 칠한 곳만 흐린 사진으로 바꾼 사진 (흐린 판은 가장자리를 늘려 붙인 뒤 흐려서 사진 끝까지 고르게)
  function photoFx(){
    if (!strokes.length || !mask) return photo;
    if (blurredAmt !== th.blurAmt || !blurred || blurred.width !== photo.width || blurred.height !== photo.height){
      const w = photo.width, h = photo.height;
      const sigma = Math.max(2, Math.round(Math.max(w, h) * .035 * th.blurAmt / 100));
      const p = Math.ceil(sigma * 3) + 1, pad = document.createElement('canvas');
      pad.width = w + 2 * p; pad.height = h + 2 * p;
      const pc = pad.getContext('2d');
      pc.imageSmoothingEnabled = false;
      pc.drawImage(photo, p, p);
      pc.drawImage(photo, 0, 0, w, 1, p, 0, w, p);
      pc.drawImage(photo, 0, h - 1, w, 1, p, h + p, w, p);
      pc.drawImage(pad, p, 0, 1, pad.height, 0, 0, p, pad.height);
      pc.drawImage(pad, w + p - 1, 0, 1, pad.height, w + p, 0, p, pad.height);
      blurred = blurred || document.createElement('canvas');
      blurred.width = w; blurred.height = h;
      const b = blurred.getContext('2d');
      b.filter = `blur(${sigma}px)`;
      b.drawImage(pad, -p, -p);
      b.filter = 'none';
      pad.width = pad.height = 0;
      blurredAmt = th.blurAmt; fxDirty = true;
    }
    if (fxDirty){
      fxCanvas = fxCanvas || document.createElement('canvas');
      if (fxCanvas.width !== photo.width || fxCanvas.height !== photo.height){ fxCanvas.width = photo.width; fxCanvas.height = photo.height; }
      const f = fxCanvas.getContext('2d');
      f.clearRect(0, 0, photo.width, photo.height);
      f.drawImage(blurred, 0, 0);
      f.globalCompositeOperation = 'destination-in';   // 칠한 곳만 남기고
      f.drawImage(mask, 0, 0);
      f.globalCompositeOperation = 'destination-over'; // 나머지는 원본
      f.drawImage(photo, 0, 0);
      f.globalCompositeOperation = 'source-over';
      fxDirty = false;
    }
    return fxCanvas;
  }
  function updateBlurBtns(){
    $('#blurUndo').disabled = $('#blurClear').disabled = !strokes.length;
  }
  function undoBlur(){
    if (!strokes.length) return;
    strokes.pop(); rebuildMask(); updateBlurBtns(); draw();
  }

  /* ---------- 사진 ---------- */
  function drawPhoto(a, r){
    ctx.save();
    ctx.beginPath();
    if (r) ctx.roundRect(a.x, a.y, a.w, a.h, r); else ctx.rect(a.x, a.y, a.w, a.h);
    ctx.clip();
    if (!photo){
      ctx.fillStyle = '#E4E7E3'; ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#9AA19C'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = bodyFont('b', 34);
      ctx.fillText('사진을 넣어주세요', a.x + a.w / 2, a.y + a.h * .5);
      ctx.restore();
      over = {x:0, y:0}; xf = null;
      return;
    }
    const sc = Math.max(a.w / photo.width, a.h / photo.height) * st.zoom / 100;
    const dw = photo.width * sc, dh = photo.height * sc;
    if (st.bright !== 100) ctx.filter = `brightness(${st.bright / 100})`;
    ctx.imageSmoothingQuality = 'high';
    if (dw < a.w - .5 || dh < a.h - .5){
      // 사진을 칸보다 작게 줄이면 빈 곳은 같은 사진을 흐리게 깔아서 채움
      const bs = Math.max(a.w / bgBlur.width, a.h / bgBlur.height) * 1.08;
      ctx.drawImage(bgBlur, a.x + (a.w - bgBlur.width * bs) / 2, a.y + (a.h - bgBlur.height * bs) / 2, bgBlur.width * bs, bgBlur.height * bs);
    }
    const x = a.x - (dw - a.w) * st.fx, y = a.y - (dh - a.h) * st.fy;
    ctx.drawImage(photoFx(), x, y, dw, dh);
    ctx.restore();
    over = {x:dw - a.w, y:dh - a.h};
    xf = {x, y, sc};
  }

  /* ---------- 디자인 3종 (글은 위쪽 고정) ---------- */
  // 카드형: 사진 전체 + 반투명 카드(색·진하기·높이) + 로고는 카드 오른쪽 위
  function tplCard(d){
    drawPhoto({x:0, y:0, w:CW, h:CH});
    const T = tone(th.cardColor);
    const M = 56, P = 52, cw = CW - M * 2, iw = cw - P * 2;
    const L = Brand.hasLogo() ? fitLogo(150, 84) : null;
    const t = fitTitle(d.apt, 80, 50, L ? iw - L.w - 28 : iw);
    const lh = lineH(t);
    const spFs = d.space ? fitLine(d.space, 'n', 34, 22, iw) : 0;
    const chipO = {h:58, fs:27, px:24, ...T.chip};
    const chips = chipItems(d), cl = chips.length ? layoutChips(chips, iw, chipO) : null;
    const noteFs = d.note ? fitLine(d.note, 'n', 30, 20, iw) : 0;
    let h = P + 26 + 20 + lh * t.lines.length + (d.space ? 12 + spFs * 1.35 : 0) + (cl ? 30 + cl.height : 0) + (d.note ? 22 + noteFs * 1.35 : 0) + P;
    if (L) h = Math.max(h, P + L.h + P);
    // 카드 높이: 0 = 글에 맞춤 ~ 100 = 사진 아래 끝까지
    const maxH = CH - M * 2;
    if (h < maxH) h += (maxH - h) * (th.cardH || 0) / 100;
    const x0 = M, y0 = M;

    softShadow(x0, y0, cw, h, 30, .22 * th.cardAlpha / 100);
    ctx.beginPath(); ctx.roundRect(x0, y0, cw, h, 30);
    ctx.fillStyle = hexA(th.cardColor, th.cardAlpha / 100); ctx.fill();
    if (L) drawLogo(T.tint, x0 + cw - P - L.w, y0 + P - 6, L.w, L.h);

    let y = y0 + P;
    label('시공 사례', x0 + P, y + 13, 24, T.lab);
    y += 26 + 20;
    ctx.fillStyle = T.ink; ctx.textBaseline = 'middle'; ctx.font = titleFont(t.size);
    for (const l of t.lines){ ctx.fillText(l, x0 + P, y + lh / 2); y += lh; }
    if (d.space){
      y += 12;
      ctx.fillStyle = T.sub; ctx.font = bodyFont('n', spFs);
      ctx.fillText(d.space, x0 + P, y + spFs * 1.35 / 2);
      y += spFs * 1.35;
    }
    if (cl){
      y += 30;
      drawChips(cl, x0 + P, y, chipO);
      y += cl.height;
    }
    if (d.note){
      y += 22;
      ctx.fillStyle = T.sub; ctx.font = bodyFont('n', noteFs);
      ctx.fillText(d.note, x0 + P, y + noteFs * 1.35 / 2);
    }
  }

  // 매거진형: 사진 전체 + 위쪽(글 쪽)을 어둡게 + 흰 글씨
  function tplOverlay(d){
    drawPhoto({x:0, y:0, w:CW, h:CH});
    const gh = Math.min(CH, CW * .72);
    let g = ctx.createLinearGradient(0, gh, 0, 0);
    g.addColorStop(0, 'rgba(24,18,14,0)');
    g.addColorStop(.5, 'rgba(24,18,14,.42)');
    g.addColorStop(1, 'rgba(24,18,14,.84)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, gh);
    // 로고 쪽(아래)도 살짝 어둡게 (흰 로고가 잘 보이게)
    g = ctx.createLinearGradient(0, CH, 0, CH - 280);
    g.addColorStop(0, 'rgba(24,18,14,.38)');
    g.addColorStop(1, 'rgba(24,18,14,0)');
    ctx.fillStyle = g; ctx.fillRect(0, CH - 280, CW, 280);
    if (Brand.hasLogo()){
      const L = fitLogo(170, 110);
      drawLogo('white', CW - 64 - L.w, CH - 60 - L.h, L.w, L.h, true);
    }

    const P = 70, w = CW - P * 2;
    const t = fitTitle(d.apt, 100, 60, w);
    const lh = lineH(t) * .97;
    const line = [d.mat, d.color, ...d.tags].filter(Boolean).join('   ·   ');
    const inFs = line ? fitLine(line, 'n', 31, 18, w) : 0;
    const sFs = d.space ? fitLine(d.space, 'b', 40, 24, w) : 0;
    const noteFs = d.note ? fitLine(d.note, 'n', 29, 18, w) : 0;
    ctx.textBaseline = 'middle';
    let y = P;
    pill(P, y, '시공 사례', {h:50, fs:23, px:22, stroke:'rgba(255,255,255,.7)', fg:'#fff'});
    y += 50 + 20;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 20;
    ctx.font = titleFont(t.size); ctx.fillStyle = '#fff';
    for (const l of t.lines){ ctx.fillText(l, P, y + lh / 2); y += lh; }
    ctx.restore();
    if (d.space){
      y += 12;
      ctx.font = bodyFont('b', sFs); ctx.fillStyle = '#fff';
      ctx.fillText(d.space, P, y + sFs * 1.3 / 2);
      y += sFs * 1.3;
    }
    y += 26;
    ctx.fillStyle = '#CDAE88'; ctx.fillRect(P, y, 64, 3);
    y += 3 + 26;
    if (line){
      ctx.font = bodyFont('n', inFs); ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillText(line, P, y + inFs / 2);
      y += inFs + 18;
    }
    if (d.note){
      ctx.font = bodyFont('n', noteFs); ctx.fillStyle = 'rgba(255,255,255,.82)';
      ctx.fillText(d.note, P, y + noteFs / 2);
    }
  }

  // 액자형: 사진 전체 위에 반투명 테두리(덮개) + 글은 위
  function tplFrame(d){
    drawPhoto({x:0, y:0, w:CW, h:CH});
    const T = tone(th.frameColor);
    const M = 48, x0 = M + 14;
    const L = Brand.hasLogo() ? fitLogo(160, 118) : null;
    const tw = CW - x0 * 2 - (L ? L.w + 36 : 0);
    const t = fitTitle(d.apt, 68, 44, tw);
    const lh = lineH(t);
    const spFs = d.space ? fitLine(d.space, 'n', 32, 20, tw) : 0;
    const chipO = {h:52, fs:25, px:22, ...T.chip};
    const chips = chipItems(d), cl = chips.length ? layoutChips(chips, tw, chipO) : null;
    const noteFs = d.note ? fitLine(d.note, 'n', 28, 18, tw) : 0;
    const block = 24 + 16 + lh * t.lines.length + (d.space ? 8 + spFs * 1.35 : 0) + (cl ? 24 + cl.height : 0) + (d.note ? 18 + noteFs * 1.35 : 0);
    const textY = 54, winY = textY + block + 38;
    const ph = CH - M - winY;

    // 사진 창만 뚫고 나머지를 테두리 색으로 반투명하게 덮음
    ctx.save();
    ctx.fillStyle = hexA(th.frameColor, th.frameAlpha / 100);
    ctx.beginPath(); ctx.rect(0, 0, CW, CH); ctx.roundRect(M, winY, CW - M * 2, ph, 26);
    ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(M, winY, CW - M * 2, ph, 26); ctx.stroke();
    ctx.restore();

    let y = textY;
    label('시공 사례', x0, y + 12, 22, T.lab);
    y += 24 + 16;
    ctx.fillStyle = T.ink; ctx.textBaseline = 'middle'; ctx.font = titleFont(t.size);
    for (const l of t.lines){ ctx.fillText(l, x0, y + lh / 2); y += lh; }
    if (d.space){
      y += 8;
      ctx.fillStyle = T.sub; ctx.font = bodyFont('n', spFs);
      ctx.fillText(d.space, x0, y + spFs * 1.35 / 2);
      y += spFs * 1.35;
    }
    if (cl){
      y += 24;
      drawChips(cl, x0, y, chipO);
      y += cl.height;
    }
    if (d.note){
      y += 18;
      ctx.fillStyle = T.sub; ctx.font = bodyFont('n', noteFs);
      ctx.fillText(d.note, x0, y + noteFs * 1.35 / 2);
    }
    if (L) drawLogo(T.tint, CW - x0 - L.w, textY + Math.min(block - L.h, 60) / 2, L.w, L.h);
  }

  const TPL = {card:tplCard, overlay:tplOverlay, frame:tplFrame};

  /* ---------- 그리기 ---------- */
  function data(){
    return {
      apt: $('#apt').value.trim() || '아파트 이름',
      space: $('#space').value.trim(),
      mat: th.mat.trim(),
      color: th.color.trim(),
      dot: th.dot,
      tags: (th.tags || []).map(s => String(s).trim()).filter(Boolean),
      note: (th.note || '').trim()
    };
  }
  let raf = 0;
  function draw(){
    if (!th) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(async () => {
      const d = data();
      const txt = d.apt + d.space + d.mat + d.color + d.tags.join('') + d.note + '시공 사례 ·사진을 넣어주세요';
      // 웹폰트가 받아지기 전에 그리면 기본 글꼴로 나와서, 필요한 글자를 먼저 받아둠
      try{
        await Promise.all([
          document.fonts.load(titleFont(80), txt),
          document.fonts.load(bodyFont('n', 30), txt),
          document.fonts.load(bodyFont('b', 30), txt),
          document.fonts.load(bodyFont('x', 30), txt)
        ]);
      }catch(e){}
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, CW, CH);
      (TPL[th.tpl] || tplCard)(d);
    });
  }
  function ready(){
    const ok = !!photo &amp;&amp; !!$('#apt').value.trim();
    $('#tSaveBtn').disabled = $('#copyBtn').disabled = !ok;
    $('#tSaveBtn').title = $('#copyBtn').title = ok ? '' : '사진과 아파트 이름을 넣어주세요';
  }
  const HINTS = {
    move: '끌어서 위치 · 휠로 크기',
    blur: '칠한 곳이 흐려져요 · 휠로 붓 크기',
    erase: '문지르면 블러가 지워져요 · 휠로 붓 크기'
  };
  function updateHint(){
    $('#hint').textContent = photo ? HINTS[st.tool] : '';
    cv.classList.toggle('can-drag', !!photo &amp;&amp; st.tool === 'move');
    cv.classList.toggle('paint', !!photo &amp;&amp; st.tool !== 'move');
    if (st.tool === 'move') $('#brushCursor').hidden = true;
  }

  /* ---------- 사진 넣기 ---------- */
  async function setPhoto(file){
    if (!file || !(file.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(file.name))) return;
    const url = URL.createObjectURL(file);
    try{
      const img = await loadImg(url);
      // 끌 때 버벅이지 않도록 긴 변 2800px로 줄여서 들고 있음 (확대 250%까지 충분)
      const k = Math.min(1, 2800 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, c.width, c.height);
      resetBlur();
      orig = c; photo = null;
      applyShape();
      st.fx = st.fy = .5; st.zoom = 100; st.bright = 100; applyTh();
      $('#tThumb').src = url; $('#tThumb').hidden = false; $('#tThumbEmpty').hidden = true;
      $('#dropTitle').textContent = '다른 사진으로 바꾸기';
      $('#dropSub').textContent = file.name;
      updateHint();
      toast('');
      ready(); draw();
    }catch(e){
      URL.revokeObjectURL(url);
      alert('이 사진은 열 수 없어요. JPG나 PNG로 넣어주세요. (아이폰 HEIC는 크롬에서 안 열려요)');
    }
  }
  $('#tFileInput').addEventListener('change', e => { setPhoto(e.target.files[0]); e.target.value = ''; });

  /* ---------- 미리보기에서 마우스: 사진 옮기기 / 블러 칠하기·지우기 ---------- */
  let drag = null;
  const toCanvas = e => { const r = cv.getBoundingClientRect(), k = CW / r.width; return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; };
  const toPhoto = e => { const [cx, cy] = toCanvas(e); return [(cx - xf.x) / xf.sc, (cy - xf.y) / xf.sc]; };
  function moveCursor(e){
    const c = $('#brushCursor');
    if (!photo || st.tool === 'move' || !e){ c.hidden = true; return; }
    const r = cv.getBoundingClientRect(), sr = $('#stage').getBoundingClientRect();
    const d = th.brush * r.width / CW;
    c.hidden = false;
    c.style.width = c.style.height = d + 'px';
    c.style.left = (e.clientX - sr.left - d / 2) + 'px';
    c.style.top = (e.clientY - sr.top - d / 2) + 'px';
  }
  cv.addEventListener('pointerdown', e => {
    if (!photo || !xf) return;
    cv.setPointerCapture(e.pointerId);
    if (st.tool === 'move'){
      drag = {x:e.clientX, y:e.clientY, fx:st.fx, fy:st.fy};
      cv.classList.add('dragging');
      return;
    }
    const p = toPhoto(e);
    stroke = {mode:st.tool, r:th.brush / 2 / xf.sc, pts:[p]};
    strokes.push(stroke);
    paint(stroke, p, p);
    updateBlurBtns();
    draw();
  });
  cv.addEventListener('pointermove', e => {
    moveCursor(e);
    if (drag){
      const k = CW / cv.getBoundingClientRect().width;
      // 사진이 칸보다 작으면(음수) 방향이 알아서 맞음
      if (over.x) st.fx = Math.min(1, Math.max(0, drag.fx - (e.clientX - drag.x) * k / over.x));
      if (over.y) st.fy = Math.min(1, Math.max(0, drag.fy - (e.clientY - drag.y) * k / over.y));
      draw();
    } else if (stroke){
      const p = toPhoto(e);
      paint(stroke, stroke.pts[stroke.pts.length - 1], p);
      stroke.pts.push(p);
      draw();
    }
  });
  const endDrag = () => { drag = null; stroke = null; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('pointerleave', () => { if (!stroke) $('#brushCursor').hidden = true; });
  cv.addEventListener('wheel', e => {
    if (!photo) return;
    e.preventDefault();
    if (st.tool === 'move'){
      st.zoom = Math.min(250, Math.max(40, Math.round(st.zoom - e.deltaY * .1)));
    } else {
      th.brush = Math.min(320, Math.max(20, Math.round((th.brush - e.deltaY * .2) / 2) * 2));
      Brand.saveSoon(); moveCursor(e);
    }
    applyTh(); draw();
  }, {passive:false});
  // Ctrl+Z: 블러 되돌리기 (글자 입력 중일 때는 원래대로 글자 되돌리기)
  addEventListener('keydown', e => {
    if ($('#tool-thumb').hidden || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
    if (e.target instanceof HTMLInputElement &amp;&amp; e.target.type !== 'range' &amp;&amp; e.target.type !== 'radio') return;
    if (!strokes.length) return;
    e.preventDefault(); undoBlur();
  });
  $('#blurUndo').addEventListener('click', undoBlur);
  $('#blurClear').addEventListener('click', () => { strokes = []; rebuildMask(); updateBlurBtns(); draw(); });

  /* ---------- 태그 (매트·컬러 말고 더 넣는 둥근 표시) ---------- */
  const tagRows = $('#tagRows');
  function renderTags(){
    const tags = th.tags || [];
    tagRows.innerHTML = tags.map((_, i) => `<div class=&quot;tagrow&quot;><label class=&quot;lab&quot; for=&quot;tag${i}&quot;>태그</label><input class=&quot;field&quot; id=&quot;tag${i}&quot; data-tag=&quot;${i}&quot; placeholder=&quot;예) 아이방 · 반려동물&quot; autocomplete=&quot;off&quot;><button type=&quot;button&quot; class=&quot;tagdel&quot; data-del=&quot;${i}&quot; aria-label=&quot;태그 ${i + 1} 빼기&quot; title=&quot;빼기&quot;>×</button></div>`).join('');
    tagRows.querySelectorAll('[data-tag]').forEach(el => { el.value = tags[+el.dataset.tag]; });
    $('#tagAdd').hidden = tags.length >= MAX_TAGS;
  }
  tagRows.addEventListener('input', e => {
    const i = e.target.dataset.tag;
    if (i == null) return;
    th.tags = th.tags.map((v, j) => j === +i ? e.target.value : v);
    Brand.saveSoon(); draw();
  });
  tagRows.addEventListener('click', e => {
    const b = e.target.closest('[data-del]');
    if (!b) return;
    th.tags = th.tags.filter((_, j) => j !== +b.dataset.del);
    renderTags(); Brand.saveSoon(); draw();
  });
  $('#tagAdd').addEventListener('click', () => {
    th.tags = [...(th.tags || []), ''];
    renderTags(); Brand.saveSoon();
    const last = tagRows.querySelector(`#tag${th.tags.length - 1}`);
    if (last) last.focus();
  });

  /* ---------- 설정 ---------- */
  function buildPickers(){
    const fontOpt = (name, k, f) => `<label><input type=&quot;radio&quot; name=&quot;${name}&quot; value=&quot;${k}&quot;><span style=&quot;font-family:${f.family};font-weight:${f.weight || f.w.b}${f.ui ? `;font-size:${f.ui}px` : ''}&quot;>${f.label}</span></label>`;
    $('#titleFontPick').innerHTML = Object.entries(TITLE_FONTS).map(([k, f]) => fontOpt('titleFont', k, f)).join('');
    $('#bodyFontPick').innerHTML = Object.entries(BODY_FONTS).map(([k, f]) => fontOpt('bodyFont', k, f)).join('');
    // 미리 정한 색들 → 맨 끝에 직접 고르기
    for (const [box, key, list] of [['#cardSwatches', 'cardColor', CARD_SWATCHES], ['#frameSwatches', 'frameColor', FRAME_SWATCHES]]){
      const sw = $(box);
      for (const [c, n] of list)
        design.elements[key].insertAdjacentHTML('beforebegin', `<button type=&quot;button&quot; class=&quot;sw&quot; data-color=&quot;${c}&quot; style=&quot;background:${c}&quot; title=&quot;${n}&quot; aria-label=&quot;${n}&quot;></button>`);
      sw.addEventListener('click', e => {
        const b = e.target.closest('.sw');
        if (!b || !th) return;
        th[key] = b.dataset.color;
        Brand.saveSoon(); applyTh(); draw();
      });
    }
  }
  // force: 브랜드를 바꿨을 때는 입력 중인 글자칸도 그 브랜드 값으로 덮어씀
  function applyTh(force){
    if (!th) return;
    for (const f of [info, design, photoForm])
      for (const k of Object.keys(THUMB_DEFAULTS)){
        const el = f.elements[k];
        if (!el || k === 'tags') continue;
        if (el instanceof HTMLInputElement &amp;&amp; el.type === 'text' &amp;&amp; document.activeElement === el &amp;&amp; !force) continue;
        el.value = th[k];
      }
    photoForm.elements.zoom.value = st.zoom;
    photoForm.elements.bright.value = st.bright;
    photoForm.elements.tool.value = st.tool;
    $('#zoomOut').textContent = st.zoom + '%';
    $('#brightOut').textContent = st.bright + '%';
    $('#brushOut').textContent = th.brush + 'px';
    $('#blurAmtOut').textContent = th.blurAmt + '%';
    $('#cardAlphaOut').textContent = th.cardAlpha + '%';
    $('#cardHOut').textContent = th.cardH ? th.cardH + '%' : '글에 맞춤';
    $('#frameAlphaOut').textContent = th.frameAlpha + '%';
    $('#cardColorRow').hidden = $('#cardAlphaRow').hidden = $('#cardHRow').hidden = th.tpl !== 'card';
    $('#frameColorRow').hidden = $('#frameAlphaRow').hidden = th.tpl !== 'frame';
    for (const [box, key] of [['#cardSwatches', 'cardColor'], ['#frameSwatches', 'frameColor']])
      document.querySelectorAll(box + ' .sw').forEach(b => b.classList.toggle('on', b.dataset.color.toLowerCase() === th[key].toLowerCase()));
  }
  function onInput(e){
    const t = e.target;
    if (!th || !t.name) return;
    if (t.name === 'apt' || t.name === 'space'){ ready(); draw(); return; }
    if (t.name === 'zoom' || t.name === 'bright'){ st[t.name] = +t.value; applyTh(); draw(); return; }
    if (t.name === 'tool'){ st.tool = t.value; updateHint(); return; }
    if (!(t.name in THUMB_DEFAULTS)) return;
    th[t.name] = t.type === 'range' ? +t.value : t.value;
    Brand.saveSoon();
    if (t.name === 'shape'){ applyShape(); ready(); }
    applyTh(); draw();
  }
  for (const f of [info, design, photoForm]){
    f.addEventListener('input', onInput);
    f.addEventListener('change', onInput);
  }
  $('#resetPhoto').addEventListener('click', () => { st.fx = st.fy = .5; st.zoom = 100; st.bright = 100; applyTh(); draw(); });
  $('#thumbSave').addEventListener('click', () => Brand.saveNow());

  /* ---------- 저장 · 복사 ---------- */
  let toastT = 0;
  function toast(msg){
    $('#toast').textContent = msg;
    clearTimeout(toastT);
    if (msg) toastT = setTimeout(() => $('#toast').textContent = '', 4000);
  }
  const pngBlob = () => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/png'));
  $('#tSaveBtn').addEventListener('click', async () => {
    const blob = await pngBlob();
    download(blob, `썸네일_${safeName($('#apt').value)}.png`);
    toast('저장했어요');
  });
  $('#copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png': pngBlob()})]);
      toast('복사했어요 · 블로그에서 Ctrl+V');
    }catch(e){
      toast('');
      alert('복사가 안 되는 환경이에요. &quot;PNG로 저장&quot;을 눌러주세요.');
    }
  });

  buildPickers();
  updateBlurBtns();
  document.fonts.addEventListener('loadingdone', draw);
  Brand.on(() => {
    th = Brand.cur().thumb;
    if (!TITLE_FONTS[th.titleFont]) th.titleFont = 'notoserif';   // 뺀 글꼴(송명·함렛·연성)을 쓰던 브랜드는 기본 글꼴로
    if (!Array.isArray(th.tags)) th.tags = [];
    blurredAmt = -1;
    renderTags(); applyShape(); applyTh(true); ready(); updateHint(); draw();
  });
  return {drop: $('#tDrop'), addFiles: files => setPhoto(files[0]), redraw: draw};
})();
</script>

<script>
/* ======================= 탭 · 끌어다 놓기 · 시작 ======================= */
const TOOLS = {logo: LogoTool, thumb: ThumbTool};
const TAB_INFO = {
  logo: {title:'로고 편집기', desc:'사진 여러 장에 브랜드 로고를 한 번에 넣어요'},
  thumb:{title:'블로그 썸네일', desc:'사진 한 장과 시공 정보로 썸네일을 만들어요'}
};
let tab = 'logo';
function showTab(t){
  if (!TOOLS[t]) t = 'logo';
  tab = t;
  $('#tool-logo').hidden = t !== 'logo';
  $('#tool-thumb').hidden = t !== 'thumb';
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#pageTitle').textContent = TAB_INFO[t].title;
  $('#pageDesc').textContent = TAB_INFO[t].desc;
  store.set('tools-tab', t);
  try{ history.replaceState(null, '', t === 'thumb' ? '#thumbnail' : location.pathname + location.search); }catch(e){}
  TOOLS[t].redraw();
}
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

// 파일을 창 어디에 끌어다 놓든: 브랜드 로고 칸이면 로고로, 아니면 지금 탭의 사진으로
const zoneFor = e => (e.target instanceof Element &amp;&amp; e.target.closest('#logoBox')) ? Brand.box : TOOLS[tab].drop;
let overZone = null;
function markOver(z){
  if (overZone &amp;&amp; overZone !== z) overZone.classList.remove('over');
  overZone = z;
  if (z) z.classList.add('over');
}
['dragenter','dragover'].forEach(t => addEventListener(t, e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); markOver(zoneFor(e));
}));
addEventListener('dragleave', e => { if (!e.relatedTarget) markOver(null); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  const z = zoneFor(e);
  markOver(null);
  if (z === Brand.box) Brand.setLogoFile(e.dataTransfer.files[0]);
  else TOOLS[tab].addFiles(e.dataTransfer.files);
});
addEventListener('paste', e => {
  if (!e.clipboardData || !e.clipboardData.files.length) return;
  e.preventDefault();
  TOOLS[tab].addFiles(e.clipboardData.files);
});

addEventListener('DOMContentLoaded', () => {
  showTab(location.hash === '#thumbnail' ? 'thumb' : (store.get('tools-tab') || 'logo'));
  Brand.init();
});
</script>

  <iframe id="f-photo" title="사진 좌우반전 도구" allow="clipboard-read; clipboard-write; web-share" hidden data-src="<!doctype html>
<html lang=&quot;ko&quot;>
<head>
<meta charset=&quot;utf-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;>
<meta name=&quot;robots&quot; content=&quot;noindex,nofollow&quot;>
